description: Cross-cutting standards and compliance assertions, each with the evidence it rests on.
standards:
- id: openapi
  conforms: true
  evidence: Five OpenAPI documents published at https://docs.talon.one/oas/ — integration.yaml, management.yaml,
    third-party.yaml, shopify-integration.yaml and outbound-notifications.yaml. Four are OpenAPI 3.1.0;
    the Shopify one is 3.0.0 and the Third-party one 3.0.1.
- id: openapi-webhooks
  conforms: true
  evidence: outbound-notifications.yaml uses the OpenAPI 3.1 webhooks{} object to describe 24 outbound
    notification payloads.
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document is published; the event surface is described as OpenAPI 3.1 webhooks
    instead.
- id: json-schema
  conforms: true
  evidence: OpenAPI 3.1 schemas are JSON Schema 2020-12 dialect by definition of the 3.1 specification.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme appears in any published spec; all APIs authenticate with an API
    key in the Authorization header (Integration ApiKey-v1, Management ManagementKey-v1) or a session
    bearer token.
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme and no /.well-known/openid-configuration on any host (all
    probed 404).
- id: rfc9457
  conforms: false
  evidence: Errors are returned as application/json with a {message, errors[]} envelope, not application/problem+json.
    See errors/talon-one-problem-types.yml.
- id: json:api
  conforms: partial
  evidence: The published error reference says the error format "is the same as that described by JSON
    API", and error entries do carry title/details/source.pointer, but the success documents are not JSON:API
    resource objects.
- id: idempotency
  conforms: true
  evidence: Integration API write endpoints accept an Idempotency-Key header; responses are stored for
    24 hours and the key is recorded in the access logs. See conventions/talon-one-conventions.yml.
- id: pagination
  conforms: true
  evidence: Offset pagination with pageSize/skip/sort plus a withTotalResultSize switch and dedicated
    no_total endpoint variants for large collections.
- id: rate-limit-headers
  conforms: false
  evidence: No X-RateLimit-*, RateLimit-* or Retry-After header is declared in any published spec, although
    429 is a declared response on 34 operations.
- id: rfc8594-sunset
  conforms: false
  evidence: 'No Sunset or Deprecation header is declared; deprecation is expressed only with OpenAPI deprecated:
    true.'
- id: mcp
  conforms: true
  evidence: Official read-only MCP server per deployment at <deployment>/v1/mcp/entrypoint, documented
