description: Talon.One is sold as an enterprise SaaS platform with custom, contact-sales pricing rather
  than public self-service tiers. Talon.One publicly names three package levels - Starter, Professional,
  and Enterprise - and prices each on the volume of data used to run promotions (transaction / session
  volume) rather than on a public per-API-call rate. All packages include unlimited access to the product
  features; the difference is scale, support, and platform capabilities. Access is granted through a sales
  engagement and demo. There is no public free tier or public per-request price for the Integration or
  Management API; API use is included in the platform subscription. Exact figures are not reconciled here.
notes: Re-read from https://www.talon.one/pricing on 2026-08-13. The three package names (Starter, Professional,
  Enterprise) and the feature lists above are quoted from that page; no prices, volume bands or currencies
  are published for any tier, so every price field below stays "custom". The only quantified figure on
  the page is the Starter line "individual pricing scheme with at least 500k coupons". Third-party marketplaces
  suggest entry pricing on the order of EUR 1,500/month plus implementation, which is NOT a Talon.One-published
  number and is recorded here only as an unreconciled third-party claim. Webhook integrations are a Professional-tier
  feature, and the number of webhooks an account may create is contractual (visible in the Campaign Manager
  under Account > Usage & Limits).
