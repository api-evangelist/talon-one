  /v1/loyalty_programs/{loyaltyProgramId}/transactions:
    get:
      operationId: getLoyaltyProgramTransactions
      summary: List loyalty program transactions
      description: '> [!note] Management API endpoints are **not** meant to be used in real-time integrations that directly serve your end users. Rate limit: 3 requests per second.


        Retrieve loyalty program transaction logs in a given loyalty program with

        filtering options applied. Manual and imported transactions are also

        included.


        > [!note] **Note**

        > - If no filters are applied, the last 50 loyalty transactions for the given loyalty program are returned.

        > - To get loyalty transaction logs for a given Integration ID in

        > a loyalty program, we recommend using the Integration API''s Get customer''s loyalty

        > logs.'
      tags:
      - Loyalty
      parameters:
      - name: loyaltyProgramId
        in: path
        required: true
        description: 'Identifier of the loyalty program. You can get the ID with

          the [List loyalty programs](https://docs.talon.one/management-api#tag/Loyalty/operation/getLoyaltyPrograms) endpoint.

          '
        example: 8
        schema:
          type: integer
      - name: loyaltyTransactionType
        in: query
        required: false
        description: 'Filter results by loyalty transaction type:

          - `manual`: Loyalty transaction that was done manually.

          - `session`: Loyalty transaction that resulted from a customer session.

          - `import`: Loyalty transaction that was imported from a CSV file.

          '
        example: manual
        schema:
          type: string
          enum:
          - manual
          - session
          - import
      - name: subledgerId
        in: query
        required: false
        description: The ID of the subledger by which we filter the data.
        example: subledger1
        schema:
          type: string
      - name: customerSessionIDs
        in: query
        required: false
        description: 'Filter the results by a list of customer session IDs.


          To include multiple IDs, repeat the parameter for each one, for example,

          `?customerSessionIDs=id1&customerSessionIDs=id2`.


          The response contains only data associated with the specified sessions.

          '
        example:
        - session_integration_id_1
        - session_integration_id_1
        schema:
          type: array
          items:
            type: string
      - name: transactionUUIDs
        in: query
        required: false
        description: 'Filter the results by a list of transaction UUIDs.


          To include multiple IDs, repeat the parameter for each one, for example,

          `?transactionUUIDs=uuid1&transactionUUIDs=uuid2`.


          The response contains only data associated with the specified transactions.

          '
        example:
        - dc608634-0100-40d9-b371-e964476bbe0f
        - 9e829590-05cf-407b-b4c0-5f28468a81e1
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        required: false
        description: 'Date and time from which results are returned. Results are filtered by

          transaction creation date.


          > [!note] **Note**

          > - This must be an RFC3339 timestamp string.

          > - You can include a time component in your string, for example, `T23:59:59` to specify the end of the day. The time zone setting

          >   considered is `UTC`. If you do not include a time component, a default time value of `T00:00:00` (midnight) in `UTC` is considered.

          '
        example: '2024-05-29T15:04:05+07:00'
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        description: 'Date and time by which results are returned. Results are filtered by

          transaction creation date.


          > [!note] **Note**

          > - This must be an RFC3339 timestamp string.

          > - You can include a time component in your string, for example, `T23:59:59` to specify the end of the day. The time zone setting

          >   considered is `UTC`. If you do not include a time component, a default time value of `T00:00:00` (midnight) in `UTC` is considered.

          '
        example: '2024-05-29T15:04:05+07:00'
        schema:
          type: string
          format: date-time
      - name: pageSize
        in: query
        required: false
        description: The number of items in the response.
        example: 50
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - $ref: '#/components/parameters/skip'
      - name: awaitsActivation
        in: query
        required: false
        description: 'If `true`: Filters results to include only point transactions that have action-based activation and have not expired.


          If `false`: Returns a `400` response.

          '
        example: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - hasMore
                - data
                properties:
                  hasMore:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoyaltyProgramTransaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
      security:
      - manager_auth: []
      - management_key: []
    servers:
    - url: https://yourbaseurl.talon.one
components:
  schemas:
    ActivateLoyaltyPointsResponse:
      type: object
      properties:
        ledgerEntries:
          type: array
          description: Updated ledger entries after activation.
          items:
            $ref: '#/components/schemas/LoyaltyLedgerEntry'
    LoyaltyLedgerEntry:
      type: object
      description: A single row of the ledger, describing one addition or deduction.
      required:
      - programID
      - type
      - amount
      - created
      - name
      - subLedgerID
      properties:
        created:
          type: string
          format: date-time
          example: '2021-07-20T22:00:00Z'
        programID:
          type: integer
          example: 5
        customerProfileID:
          type: string
          example: URNGV8294NV
        cardID:
          type: integer
          example: 241
        customerSessionID:
          type: string
          example: t2gy5s-47274
        eventID:
          type: integer
          example: 5
        type:
          type: string
          description: 'The type of the ledger transaction. Possible values are:

            - `addition`

            - `subtraction`

            - `expire`

            - `expiring` (for expiring points ledgers)

            '
          example: addition
        amount:
          type: number
          example: 100
        startDate:
          type: string
          format: date-time
          example: '2021-07-20T22:00:00Z'
        expiryDate:
          type: string
          format: date-time
          example: '2022-07-20T22:00:00Z'
        name:
          type: string
          description: A name referencing the condition or effect that added this entry, or the specific name provided in an API call.
          example: Add points on purchase
        subLedgerID:
          type: string
          description: This specifies if we are adding loyalty points to the main ledger or a subledger.
          example: mysubledger
        userID:
          type: integer
          description: This is the ID of the user who created this entry, if the addition or subtraction was done manually.
          example: 499
        archived:
          type: boolean
          description: Indicates if the entry belongs to the archived session.
          example: false
        flags:
          $ref: '#/components/schemas/LoyaltyLedgerEntryFlags'
          description: A map of flags providing additional details about the entry.
        validityDuration:
          type: string
          description: 'The duration for which the points remain active, relative to the  activation date.


            **Note**: This only applies to points for which `awaitsActivation` is `true` and `expiryDate` is not set.

            '
          example: 30D
    APIError:
      type: object
      required:
      - source
      - title
      properties:
        title:
          type: string
          description: Short description of the problem.
        details:
          type: string
          description: Longer description of this specific instance of the problem.
        source:
          $ref: '#/components/schemas/ErrorSource'
    ErrorResponseWithStatus:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          description: An array of individual problems encountered during the request.
          items:
            $ref: '#/components/schemas/APIError'
        StatusCode:
          type: integer
          description: The error code
    LoyaltyLedgerEntryFlags:
      type: object
      description: A map of flags providing additional details about the entry.
      properties:
        createsNegativeBalance:
          type: boolean
          description: Set to true if the entry creates negative balance.
    LoyaltyBalanceWithTier:
      allOf:
      - $ref: '#/components/schemas/LoyaltyBalance'
      - type: object
        properties:
          currentTier:
            $ref: '#/components/schemas/Tier'
            description: Customer's current tier.
            example: bronze
          projectedTier:
            $ref: '#/components/schemas/ProjectedTier'
          pointsToNextTier:
            type: number
            description: The number of points required to move up a tier.
            example: 20
          nextTierName:
            type: string
            description: 'The name of the next higher tier level in the loyalty program.


              **Note**:

              - Returns `null` if the customer has reached the highest available tier.

              - Returns the lowest level tier name if the customer is not currently assigned to any tier.

              '
            example: Silver
    ProjectedTier:
      type: object
      required:
      - projectedActivePoints
      properties:
        projectedActivePoints:
          type: number
          description: The active points of the customer when their current tier expires.
          example: 198
        stayInTierPoints:
          type: number
          description: 'The number of points the customer needs to stay in the current tier.


            **Note**: This is included in the response when the customer is projected to be downgraded.

            '
          example: 2
        projectedTierName:
          type: string
          description: The name of the tier the user will enter once their current tier expires.
          example: Tier 1
    Tier:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          description: The internal ID of the tier.
          example: 11
        name:
          type: string
          description: The name of the tier.
          example: bronze
        startDate:
          type: string
          format: date-time
          description: Date and time when the customer moved to this tier. This value uses the loyalty program's time zone setting.
          example: 2021-05-03T12:32:00Z07:00
        expiryDate:
          type: string
          format: date-time
          description: Date when tier level expires in the RFC3339 format (in the Loyalty Program's timezone).
          example: 2022-08-02T15:04:05Z07:00
        downgradePolicy:
          type: string
          enum:
          - one_down
          - balance_based
          description: "The policy that defines how customer tiers are downgraded in the loyalty program after tier reevaluation.\n - `one_down`: If the customer doesn't have enough points to stay in the current tier, they are downgraded by one tier.\n - `balance_based`: The customer's tier is reevaluated based on the amount of active points they have at the moment.\n"
    LedgerTransactionLogEntryIntegrationAPI:
      type: object
      description: Log entry for a given loyalty profile transaction.
      required:
      - transactionUUID
      - created
      - programId
      - type
      - name
      - startDate
      - expiryDate
      - subledgerId
      - amount
      - id
      properties:
        transactionUUID:
          type: string
          description: Unique identifier of the transaction in the UUID format.
          example: ce59f12a-f53b-4014-a745-636d93f2bd3f
        created:
          type: string
          format: date-time
          description: Date and time the loyalty transaction occurred.
          example: 2022-01-02T15:04:05Z07:00
        programId:
          type: integer
          description: ID of the loyalty program.
          example: 324
        customerSessionId:
          type: string
          description: ID of the customer session where the transaction occurred.
          maxLength: 255
          example: 05c2da0d-48fa-4aa1-b629-898f58f1584d
        storeIntegrationId:
          type: string
          minLength: 1
          maxLength: 1000
          description: The integration ID of the store where the transaction occurred. Only set for transactions created by a customer session or event that referenced a store.
          example: STORE-001
        type:
          type: string
          enum:
          - addition
          - subtraction
          description: "Type of transaction. Possible values:\n  - `addition`: Signifies added points.\n  - `subtraction`: Signifies deducted points.\n"
          maxLength: 255
          example: addition
        name:
          type: string
          description: Name or reason of the loyalty ledger transaction.
          maxLength: 255
          example: Reward 10% points of a purchase's current total
        startDate:
          type: string
          description: "When points become active. Possible values:\n  - `immediate`: Points are immediately active.\n  - `on_action`: Points become active based on the customer's action.\n  - a timestamp value: Points become active at a given date and time.\n"
          maxLength: 64
          example: 2022-01-02T15:04:05Z07:00
        expiryDate:
          type: string
          description: "Date when points expire. Possible values are:\n  - `unlimited`: Points have no expiration date.\n  - `timestamp value`: Points expire on the given date.\n"
          example: 2022-08-02T15:04:05Z07:00
        subledgerId:
          type: string
          description: ID of the subledger.
          maxLength: 64
          example: sub-123
        amount:
          type: number
          description: Amount of loyalty points added or deducted in the transaction.
          example: 10.25
        id:
          type: integer
          description: ID of the loyalty ledger transaction.
          example: 123
        rulesetId:
          type: integer
          description: The ID of the ruleset containing the rule that triggered this effect.
          example: 11
        ruleName:
          type: string
          description: The name of the rule that triggered this effect.
          example: Add 2 points
        flags:
          $ref: '#/components/schemas/LoyaltyLedgerEntryFlags'
          description: The flags of the transaction, when applicable. The `createsNegativeBalance`  flag indicates whether the transaction results in a negative balance.
        validityDuration:
          type: string
          description: 'The duration for which the points remain active, relative to the  activation date.


            **Note**: This only applies to points for which `awaitsActivation` is `true` and `expiryDate` is not set.

            '
          example: 30D
    DeleteLoyaltyTransactionsRequest:
      type: object
      description: Request to delete transactions based on the specified scope.
      additionalProperties: false
      required:
      - scope
      properties:
        scope:
          type: string
          description: '`AllSubledgers` deletes all transactions for the specified customer profile from all ledgers in the loyalty program.


            `SelectedSubledgers` deletes all transactions for the specified customer profile only from the given ledgers in the loyalty program.

            '
          enum:
          - AllSubledgers
          - SelectedSubledgers
          example: SelectedSubledgers
        subledgerIds:
          type:
          - array
          - 'null'
          description: 'The IDs of the ledgers from which to delete the customer''s transactions. This parameter is required if the `scope` is set to `SelectedSubledgers`.


            To specify the main ledger, provide an empty string ("").

            '
          items:
            type: string
          example:
          - subledger1
          - subledger2
    ErrorSource:
      type: object
      description: 'The source of the current error, exactly one of `pointer`, `parameter` or `line` will be defined.

        '
      properties:
        pointer:
          type: string
          description: Pointer to the path in the payload that caused this error.
        parameter:
          type: string
          description: Query parameter that caused this error.
        line:
          type: string
          description: Line number in uploaded multipart file that caused this error. 'N/A' if unknown.
        resource:
          type: string
          description: Pointer to the resource that caused this error.
    ActivateLoyaltyPoints:
