            example: enabled
            description: 'The state of the campaign.

              '
          tags:
            type: array
            description: A list of tags for the campaign.
            example:
            - summer
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 50
          features:
            type: array
            description: The features enabled in this campaign.
            example:
            - coupons
            - referrals
            items:
              type: string
              enum:
              - coupons
              - referrals
              - loyalty
              - giveaways
              - strikethrough
              - achievements
    IntegrationCampaign:
      allOf:
      - $ref: '#/components/schemas/IntegrationCampaignBase'
      - type: object
        required:
        - rules
        properties:
          rules:
            type: array
            description: A list of rules containing customer-facing details of the rewards defined in the campaign.
            items:
              $ref: '#/components/schemas/RuleMetadata'
          linkedStoreIds:
            type: array
            description: A list of store IDs linked to this campaign.
            items:
              type: integer
            example:
            - 1
            - 2
          linkedAudienceIds:
            type: array
            description: A list of audience IDs linked to this campaign.
            items:
              type: integer
            example:
            - 3
            - 4
    BetweenCheckAttributeBlock:
      type: object
      title: BetweenCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for the `between` operator, which requires both a minimum and maximum value.
      required:
      - min
      - max
      properties:
        operator:
          type: string
          description: The range comparison operator. Must be `between`.
          enum:
          - between
        min:
          description: The minimum value allowed for the `between` operator.
          example: 10
        max:
          description: The maximum value allowed for the `between` operator.
          example: 100
    UserEntity:
      type: object
      required:
      - userId
      properties:
        userId:
          type: integer
          description: The ID of the user associated with this entity.
          example: 388
    PromotionCheckAttributeBlock:
      allOf:
      - $ref: '#/components/schemas/CheckAttributeBlockBase'
      - type: object
        title: PromotionCheckAttributeBlock
        description: A `CheckAttributeBlock` valid in a promotion rule, where each `onFailure` block must itself be a valid promotion block.
        properties:
          onFailure:
            type: array
            description: Promotion blocks evaluated when this block fails or returns false.
            items:
              $ref: '#/components/schemas/PromotionBlock'
    UpdateAudienceMembershipBlock:
      allOf:
      - $ref: '#/components/schemas/BaseBlock'
      - type: object
        title: UpdateAudienceMembershipBlock
        description: A block that adds a customer to or removes them from an audience.
        required:
        - operator
        - profile
        - audience
        properties:
          operator:
            type: string
            enum:
            - add
            - remove
            description: The action to perform.
            example: add
          profile:
            type: string
            enum:
            - Current
            - Advocate
            description: The customer profile to add or remove from the audience. `Current` targets the customer in the current session; `Advocate` targets the person who invited their friend via referral program.
            example: Current
          audience:
            type: object
            description: The audience to add the customer to or remove them from.
            required:
            - id
            - name
            properties:
              id:
                type: integer
                description: The ID of the audience.
                example: 42
              name:
                type: string
                description: The display name of the audience.
                example: Travel audience
              integration:
                type: string
                description: 'The Talon.One-supported [3rd-party platform](https://docs.talon.one/docs/dev/technology-partners/overview) that this audience was created in.


                  For example, `mParticle`, `Segment`, `Shopify`, `Braze`, or `Iterable`.


                  **Note:** If you do not integrate with any of these platforms, do not use this property.

                  '
                example: mparticle
              integrationId:
                type: string
                description: 'The ID of this audience in the third-party integration.


                  **Note:** To create an audience that doesn''t come from a 3rd party platform, do not use this property.

                  '
                example: 382370BKDB946
    CheckBudgetBlock:
      allOf:
      - $ref: '#/components/schemas/BaseBlock'
      - type: object
        title: CheckBudgetBlock
        description: A block that verifies if a specific budget has sufficient limit available, and whether this limit meets or exceeds a specific value.
        required:
        - operator
        - action
        properties:
          operator:
            type: string
            enum:
            - available
            - enoughFor
            description: The comparison operator applied to the limit. `available` checks if there is budget available for a given limitable action; `enoughFor` checks if the available budget meets or exceeds a specific value limit.
            example: available
          action:
            type: string
            enum:
            - redeemCoupon
            - redeemReferral
            - setDiscount
            - createCoupon
            - createReferral
            - setDiscountEffect
            - createLoyaltyPoints
            - createLoyaltyPointsEffect
            - redeemLoyaltyPoints
            - redeemLoyaltyPointsEffect
            - awardGiveaway
            - addFreeItemEffect
            - customEffect
            - callApi
            description: The limitable action to check.
            example: setDiscount
          value:
            type: number
            description: The value to check against when using the `enoughFor` operator.
            example: 5
          onFailure:
            type: array
            description: Promotion blocks evaluated when this block fails or returns false.
            items:
              $ref: '#/components/schemas/PromotionBlock'
    SelectorBlock:
      description: A predicate block valid inside a selector filter step. The `type` field determines the block variant.
      oneOf:
      - $ref: '#/components/schemas/CheckAttributeBlock'
      - $ref: '#/components/schemas/SelectorGroupBlock'
      - $ref: '#/components/schemas/PassthroughBlock'
      discriminator:
        propertyName: type
        mapping:
          checkAttribute: '#/components/schemas/CheckAttributeBlock'
          group: '#/components/schemas/SelectorGroupBlock'
          passthrough: '#/components/schemas/PassthroughBlock'
    PassthroughBlock:
      type: object
      title: PassthroughBlock
      description: A block representing a Talang expression that could not be mapped to a typed block. The expression is preserved in its raw Talang array form for diagnostic and round-trip purposes.
      required:
      - id
      - type
      - expression
      properties:
        id:
          type: string
          description: Unique identifier for this block.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type:
          type: string
          enum:
          - passthrough
          description: The type discriminator for this block.
        expression:
          type: array
          description: The raw Talang expression as an array. For a function call, the first element is the function name and subsequent elements are its arguments. For any other expression (for example a bare attribute path or a literal value), this is a single-element array containing that value.
          items: {}
    ListCheckAttributeBlock:
      type: object
      title: ListCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for operators that test list membership against a set of values.
      required:
      - values
      properties:
        operator:
          type: string
          description: The list membership operator applied to the attribute.
          enum:
          - containsOneOf
          - containsNoneOf
          - containsAllOf
        values:
          description: The set of values to match against.
    CheckAttributeBlock:
      allOf:
      - $ref: '#/components/schemas/CheckAttributeBlockBase'
      oneOf:
      - $ref: '#/components/schemas/ScalarCheckAttributeBlock'
      - $ref: '#/components/schemas/BetweenCheckAttributeBlock'
      - $ref: '#/components/schemas/ListCheckAttributeBlock'
      - $ref: '#/components/schemas/ListWithCountCheckAttributeBlock'
      - $ref: '#/components/schemas/UnaryCheckAttributeBlock'
      - $ref: '#/components/schemas/WithinCheckAttributeBlock'
      discriminator:
        propertyName: operator
        mapping:
          equals: '#/components/schemas/ScalarCheckAttributeBlock'
          not(equals): '#/components/schemas/ScalarCheckAttributeBlock'
          lessThan: '#/components/schemas/ScalarCheckAttributeBlock'
          lessThanOrEqual: '#/components/schemas/ScalarCheckAttributeBlock'
          greaterThan: '#/components/schemas/ScalarCheckAttributeBlock'
          greaterThanOrEqual: '#/components/schemas/ScalarCheckAttributeBlock'
          contains: '#/components/schemas/ScalarCheckAttributeBlock'
          not(contains): '#/components/schemas/ScalarCheckAttributeBlock'
          matchesRegexp: '#/components/schemas/ScalarCheckAttributeBlock'
          startsWith: '#/components/schemas/ScalarCheckAttributeBlock'
          endsWith: '#/components/schemas/ScalarCheckAttributeBlock'
          oneOf: '#/components/schemas/ScalarCheckAttributeBlock'
          not(oneOf): '#/components/schemas/ScalarCheckAttributeBlock'
          inCollection: '#/components/schemas/ScalarCheckAttributeBlock'
          not(inCollection): '#/components/schemas/ScalarCheckAttributeBlock'
          between: '#/components/schemas/BetweenCheckAttributeBlock'
          containsOneOf: '#/components/schemas/ListCheckAttributeBlock'
          containsNoneOf: '#/components/schemas/ListCheckAttributeBlock'
          containsAllOf: '#/components/schemas/ListCheckAttributeBlock'
          containsAtLeast: '#/components/schemas/ListWithCountCheckAttributeBlock'
          containsExactly: '#/components/schemas/ListWithCountCheckAttributeBlock'
          empty: '#/components/schemas/UnaryCheckAttributeBlock'
          not(empty): '#/components/schemas/UnaryCheckAttributeBlock'
          exists: '#/components/schemas/UnaryCheckAttributeBlock'
          not(exists): '#/components/schemas/UnaryCheckAttributeBlock'
          isTrue: '#/components/schemas/UnaryCheckAttributeBlock'
          isFalse: '#/components/schemas/UnaryCheckAttributeBlock'
          after: '#/components/schemas/ScalarCheckAttributeBlock'
          before: '#/components/schemas/ScalarCheckAttributeBlock'
          within: '#/components/schemas/WithinCheckAttributeBlock'
          not(within): '#/components/schemas/WithinCheckAttributeBlock'
    Selector:
      type: object
      title: Selector
      description: A named pipeline of steps (filter, sort, map, etc.) that filters or transforms a list of cart items. Replaces `cartItemFilter` [bindings](https://docs.talon.one/management-api#tag/Campaigns/operation/getRuleset.responses.200.bindings) in V1 rulesets.
      required:
      - name
      - type
      - source
      - steps
      properties:
        name:
          type: string
          description: The name of the selector binding.
          example: discountedCartItems
        type:
          type: string
          enum:
          - selector
          description: A binding of type `selector`.
          example: selector
        source:
          type: string
          description: The attribute path the pipeline draws items from.
          example: $Session.CartItems
        steps:
          type: array
          description: Ordered pipeline steps applied to the source items.
          items:
            $ref: '#/components/schemas/SelectorStep'
    UpdateAchievementProgressBlock:
      allOf:
      - $ref: '#/components/schemas/BaseBlock'
      - type: object
        title: UpdateAchievementProgressBlock
        description: A block that updates the progress of a customer in an achievement.
        required:
        - operator
        - value
        - achievement
        properties:
          operator:
            type: string
            enum:
            - increaseBy
            example: increaseBy
          value:
            type: string
            description: The value to update the progress by. Supports template placeholders (e.g. "{{$Session.Total / 2}}") for dynamic quantities.
            example: '10'
          achievement:
            type: object
            description: The achievement to update.
            required:
            - id
            - name
            - title
            - target
            properties:
              id:
                type: integer
                description: The ID of the achievement.
                example: 42
              name:
                type: string
                description: The internal name of the achievement used in API requests.
                example: Order50Discount
              title:
                type: string
                description: The display name of the achievement in the Campaign Manager.
                example: 50% off on 50th purchase.
              target:
                type: number
                description: The required number of actions or the transactional milestone to complete the achievement.
                example: 50
    Campaign:
