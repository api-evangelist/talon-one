        activeRevisionVersionId:
          type: integer
          description: 'ID of the revision version that is active on the campaign.

            '
          example: 6
        version:
          type: integer
          description: 'Incrementing number representing how many revisions have been activated on this campaign, starts from 0 for a new campaign.

            '
          example: 6
        currentRevisionId:
          type: integer
          description: 'ID of the revision currently being modified for the campaign.

            '
          example: 6
        currentRevisionVersionId:
          type: integer
          description: 'ID of the latest version applied on the current revision.

            '
          example: 6
        stageRevision:
          type: boolean
          description: 'Flag for determining whether we use current revision when sending requests with staging API key.

            '
          example: false
          default: false
    ListWithCountCheckAttributeBlock:
      type: object
