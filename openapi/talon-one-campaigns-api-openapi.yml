    ReserveCouponBlock:
      allOf:
      - $ref: '#/components/schemas/BaseBlock'
      - type: object
        title: ReserveCouponBlock
        description: A block that reserve a coupon during a customer session.
    MapSelectorStep:
      type: object
      title: MapSelectorStep
      description: Transforms each item using an expression.
      required:
      - type
      - expression
      properties:
        type:
          type: string
          enum:
          - map
          description: A step discriminator of type `map`.
          example: map
        expression:
          type: string
          description: The attribute path each item is mapped to.
          example: $Item.Price
    TriggerCustomEffectBlock:
      allOf:
      - $ref: '#/components/schemas/BaseBlock'
      - type: object
        title: TriggerCustomEffectBlock
        description: A block that triggers a configured custom effect and passes its required parameters.
        required:
        - customEffect
        - target
        properties:
          customEffect:
            type: object
            description: The custom effect to trigger.
            required:
            - id
            - name
            - title
            properties:
              id:
                type: integer
                description: The unique identifier of the custom effect.
                example: 1
              name:
                type: string
                description: The name of the custom effect, as used in API requests.
                example: sendEmail
              title:
                type: string
                description: The display name of the custom effect.
                example: Send email
          params:
            type: object
            additionalProperties: true
            description: The custom effect's parameters, in configured order. Each property name is the parameter's title, lowercased with spaces replaced by underscores (for example, `Order ID` becomes `order_id`); falls back to `param_0`, `param_1`, and so on if a title is blank or collides with another.
            example:
              template_id: TPL-10293
          target:
            type: object
            required:
            - type
            description: The target scope of this effect.
            properties:
              type:
                type: string
                enum:
                - cart
                - allItems
                - selector
                - globalFilter
                - bundle
                description: 'The scope the custom effect applies to: - `cart` applies once to the whole cart. - `allItems` applies once per cart item. - `selector` applies once per item matched by the named selector. - `globalFilter` applies once per item matched by the named global item filter. - `bundle` applies once per item in the named bundle.'
                example: cart
              name:
                type: string
                description: The name of the targeted selector or bundle. Only set when `type` is `selector`, `globalFilter`, or `bundle`.
                example: giftBundle
          onError:
            type: object
            description: Named error handlers evaluated when a specific error occurs.
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/PromotionBlock'
    UpdateCampaign:
