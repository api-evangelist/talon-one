        applicationId:
          type: integer
          description: The ID of the Application that owns this entity.
          example: 322
        sessionId:
          description: 'The **internal** ID of the session.

            '
          type: integer
          example: 233
        customerSessionId:
          type: string
          description: ID of the customer session where the transaction occurred.
          maxLength: 255
          example: 05c2da0d-48fa-4aa1-b629-898f58f1584d
        type:
          type: string
          enum:
          - addition
          - subtraction
          description: "Type of transaction. Possible values:\n  - `addition`: Signifies added points.\n  - `subtraction`: Signifies deducted points.\n"
          maxLength: 255
          example: addition
        name:
          type: string
          description: Name or reason of the loyalty ledger transaction.
          maxLength: 255
          example: Reward 10% points of a purchase's current total
        startDate:
          type: string
          description: "When points become active. Possible values:\n  - `immediate`: Points are immediately active.\n  - a timestamp value: Points become active at a given date and time.\n"
          maxLength: 64
          example: 2022-01-02T15:04:05Z07:00
        expiryDate:
          type: string
          description: "Date when points expire. Possible values are:\n  - `unlimited`: Points have no expiration date.\n  - `timestamp value`: Points become active from the given date.\n"
          example: 2022-08-02T15:04:05Z07:00
        subledgerId:
          type: string
          description: ID of the subledger.
          maxLength: 64
          example: sub-123
        amount:
          type: number
          description: Amount of loyalty points added or deducted in the transaction.
          example: 10.25
        id:
          type: integer
          description: ID of the loyalty ledger entry.
          example: 123
    UpdateLoyaltyCardRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: 'Status of the loyalty card. Can be `active` or `inactive`.

            '
          example: active
    UserEntity:
      type: object
      required:
      - userId
      properties:
        userId:
          type: integer
          description: The ID of the user associated with this entity.
          example: 388
    LoyaltyCardBatch:
      allOf:
      - type: object
        required:
        - numberOfCards
        properties:
          numberOfCards:
            type: integer
            description: Number of loyalty cards in the batch.
            example: 5000
          batchId:
            type: string
            description: ID of the loyalty card batch.
            minLength: 4
            maxLength: 20
            pattern: ^[A-Za-z0-9_-]*$
            example: hwernpjz
          status:
            type: string
            enum:
            - active
