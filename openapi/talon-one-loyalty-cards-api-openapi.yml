        in: query
        required: false
        description: The ID of the subledger by which we filter the data.
        example: subledger1
        schema:
          type: string
      - name: customerSessionIDs
        in: query
        required: false
        description: 'Filter the results by a list of customer session IDs.


          To include multiple IDs, repeat the parameter for each one, for example,

          `?customerSessionIDs=id1&customerSessionIDs=id2`.


          The response contains only data associated with the specified sessions.

          '
        example:
        - session_integration_id_1
        - session_integration_id_1
        schema:
          type: array
          items:
            type: string
      - name: transactionUUIDs
        in: query
        required: false
        description: 'Filter the results by a list of transaction UUIDs.


          To include multiple IDs, repeat the parameter for each one, for example,

          `?transactionUUIDs=uuid1&transactionUUIDs=uuid2`.


          The response contains only data associated with the specified transactions.

          '
        example:
        - dc608634-0100-40d9-b371-e964476bbe0f
        - 9e829590-05cf-407b-b4c0-5f28468a81e1
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - hasMore
                properties:
                  hasMore:
                    type: boolean
                    description: true means there is more data in the source collection to request..
                    example: true
                  data:
                    type: array
                    description: List of loyalty card transaction logs.
                    items:
                      $ref: '#/components/schemas/CardLedgerTransactionLogEntry'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
      security:
      - manager_auth: []
      - management_key: []
    servers:
    - url: https://yourbaseurl.talon.one
  /v1/loyalty_programs/{loyaltyProgramId}/cards/{loyaltyCardId}/transfer:
    put:
      operationId: transferLoyaltyCard
      summary: Transfer card data
      description: '> [!note] Management API endpoints are **not** meant to be used in real-time integrations that directly serve your end users. Rate limit: 3 requests per second.


        Transfer loyalty card data, such as linked customers, loyalty balances and

        transactions, from a given loyalty card to a new, automatically created

        loyalty card.


        > [!important] **Note**

        > - The original card is automatically blocked once the new card is created,

        and it cannot be activated again.

        > - The default status of the new card is _active_.'
      tags:
      - Loyalty Cards
      parameters:
      - name: loyaltyProgramId
        in: path
        description: 'Identifier of the card-based loyalty program containing the loyalty card. You can get the ID with

          the [List loyalty programs](https://docs.talon.one/management-api#tag/Loyalty/operation/getLoyaltyPrograms) endpoint.

          '
        example: 33
        required: true
        schema:
          type: integer
      - name: loyaltyCardId
        in: path
        description: 'Identifier of the loyalty card. You can get the identifier with

          the [List loyalty

          cards](https://docs.talon.one/management-api#tag/Loyalty-cards/operation/getLoyaltyCards)

          endpoint.


          **Important**: The loyalty card ID requires [URL

          encoding](https://www.w3schools.com/tags//ref_urlencode.asp) if it

          contains special characters. For example, you must encode `NewCard2026%`

          as `NewCard2026%25`.

          '
        example: summer-loyalty-card-0543
        required: true
        schema:
          type: string
          minLength: 4
          maxLength: 108
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferLoyaltyCard'
        description: body
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithStatus'
      security:
      - manager_auth: []
      - management_key: []
    servers:
    - url: https://yourbaseurl.talon.one
components:
  schemas:
    LoyaltyCardIdentifier:
      type: string
      description: 'The identifier of the loyalty card, which must match the regular expression `^[A-Za-z0-9._%+@-]+$`.

        '
      maxLength: 108
      minLength: 4
      pattern: ^[A-Za-z0-9._%+@-]+$
      example: summer-loyalty-card-0543
    LoyaltyBalance:
      type: object
      description: Point balance of a ledger in the Loyalty Program.
      properties:
        activePoints:
          type: number
          title: Current Balance
          description: Total amount of points awarded to this customer and available to spend.
          example: 286
        pendingPoints:
          type: number
          title: Total pending points
          description: Total amount of points awarded to this customer but not available until their start date.
          example: 50
        spentPoints:
          type: number
          title: Total spent points
          description: Total amount of points already spent by this customer.
          example: 150
        expiredPoints:
          type: number
          title: Total expired points
          description: Total amount of points awarded but never redeemed. They cannot be used anymore.
          example: 286
        negativePoints:
          type: number
          title: Current negative balance
          description: Total amount of negative points. This implies that `activePoints` is `0`.
          example: 286
    LoyaltyBalances:
      type: object
      description: List of loyalty balances for a ledger and its subledgers.
      properties:
        balance:
          $ref: '#/components/schemas/LoyaltyBalance'
          title: Loyalty points balance of a ledger
        subledgerBalances:
          type: object
          description: Map of the loyalty balances of the subledgers of a ledger.
          additionalProperties:
            $ref: '#/components/schemas/LoyaltyBalance'
          example:
            mysubledger:
              activePoints: 286
              pendingPoints: 50
              spentPoints: 150
              expiredPoints: 25
              negativePoints: 0
    GenerateLoyaltyCard:
      type: object
      description: The parameters necessary to generate a loyalty card.
      properties:
        status:
          type: string
          enum:
          - active
          - inactive
          default: active
          description: Status of the loyalty card.
          example: active
        customerProfileIds:
          type: array
          description: Integration IDs of the customer profiles linked to the card.
          items:
            type: string
          example:
          - R195412
          - G244519
        cardIdentifier:
          $ref: '#/components/schemas/LoyaltyCardIdentifier'
      example:
        status: inactive
        customerProfileIds:
        - R195412
        - G244519
        cardIdentifier: summer-loyalty-card-0543
        attributes:
          preferredReward: discount
          enrollmentSource: mobile
    LoyaltyCardBalances:
      allOf:
      - $ref: '#/components/schemas/LoyaltyBalances'
      - type: object
        description: List of customer profiles linked to the loyalty card.
        properties:
          profiles:
            type: array
            description: Customer profiles linked to the loyalty card.
            items:
              $ref: '#/components/schemas/LoyaltyCardProfileRegistration'
    ErrorResponseWithStatus:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          description: An array of individual problems encountered during the request.
          items:
            $ref: '#/components/schemas/APIError'
        StatusCode:
          type: integer
          description: The error code
    CardLedgerPointsEntryIntegrationAPI:
      type: object
      description: Loyalty card points with start and expiry dates.
      required:
      - id
      - transactionUUID
      - created
      - programId
      - name
      - startDate
      - expiryDate
      - subledgerId
      - amount
      properties:
        id:
          type: integer
          description: ID of the transaction that adds loyalty points.
          example: 123
        transactionUUID:
          type: string
          description: Unique identifier of the transaction in the UUID format.
          example: ce59f12a-f53b-4014-a745-636d93f2bd3f
        created:
          type: string
          format: date-time
          description: Date and time the loyalty card points were added.
          example: 2022-01-02T15:04:05Z07:00
        programId:
          type: integer
          description: ID of the loyalty program.
          example: 324
        customerProfileID:
          type: string
          description: Integration ID of the customer profile linked to the card.
          example: URNGV8294NV
        customerSessionId:
          type: string
          description: ID of the customer session where points were added.
          maxLength: 255
          example: 05c2da0d-48fa-4aa1-b629-898f58f1584d
        name:
          type: string
          description: Name or reason of the transaction that adds loyalty points.
          maxLength: 255
          example: Reward 10% points of a purchase's current total
        startDate:
          type: string
          description: "When points become active. Possible values:\n  - `immediate`: Points are active immediately.\n  - `timestamp value`: Points become active at a given date and time.\n"
          maxLength: 64
          example: 2022-01-02T15:04:05Z07:00
        expiryDate:
          type: string
          description: "Date when points expire. Possible values are:\n  - `unlimited`: Points have no expiration date.\n  - `timestamp value`: Points expire on the given date and time.\n"
          example: 2022-08-02T15:04:05Z07:00
        subledgerId:
          type: string
          description: ID of the subledger.
          maxLength: 64
          example: sub-123
        amount:
          type: number
          description: Amount of loyalty points added in the transaction.
          example: 10.25
        validityDuration:
          type: string
          description: 'The duration for which the points remain active, relative to the  activation date.


            **Note**: This only applies to points for which `awaitsActivation` is `true` and `expiryDate` is not set.

            '
          example: 30D
    Tier:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          description: The internal ID of the tier.
          example: 11
        name:
          type: string
          description: The name of the tier.
          example: bronze
        startDate:
          type: string
          format: date-time
          description: Date and time when the customer moved to this tier. This value uses the loyalty program's time zone setting.
          example: 2021-05-03T12:32:00Z07:00
        expiryDate:
          type: string
          format: date-time
          description: Date when tier level expires in the RFC3339 format (in the Loyalty Program's timezone).
          example: 2022-08-02T15:04:05Z07:00
        downgradePolicy:
          type: string
          enum:
          - one_down
          - balance_based
          description: "The policy that defines how customer tiers are downgraded in the loyalty program after tier reevaluation.\n - `one_down`: If the customer doesn't have enough points to stay in the current tier, they are downgraded by one tier.\n - `balance_based`: The customer's tier is reevaluated based on the amount of active points they have at the moment.\n"
    CardLedgerTransactionLogEntryIntegrationAPI:
      type: object
      description: Log entry for a given loyalty card transaction.
      required:
      - transactionUUID
      - created
      - programId
      - cardIdentifier
      - type
      - name
      - startDate
      - expiryDate
      - subledgerId
      - amount
      - id
      properties:
        transactionUUID:
          type: string
          description: Unique identifier of the transaction in the UUID format.
          example: ce59f12a-f53b-4014-a745-636d93f2bd3f
        created:
          type: string
          format: date-time
          description: Date and time the loyalty card transaction occurred.
          example: 2022-01-02T15:04:05Z07:00
        programId:
          type: integer
          description: ID of the loyalty program.
          example: 324
        cardIdentifier:
          $ref: '#/components/schemas/LoyaltyCardIdentifier'
        customerSessionId:
          type: string
          description: ID of the customer session where the transaction occurred.
          maxLength: 255
          example: 05c2da0d-48fa-4aa1-b629-898f58f1584d
        type:
          type: string
          enum:
          - addition
          - subtraction
          description: "Type of transaction. Possible values:\n  - `addition`: Signifies added points.\n  - `subtraction`: Signifies deducted points.\n"
          maxLength: 255
          example: addition
        name:
          type: string
          description: Name or reason of the loyalty ledger transaction.
          maxLength: 255
          example: Reward 10% points of a purchase's current total
        startDate:
          type: string
          description: "When points become active. Possible values:\n  - `immediate`: Points are active immediately.\n  - `on_action`: Points become active based on the customer's action.\n  - a timestamp value: Points become active at a given date and time.\n"
          maxLength: 64
          example: 2022-01-02T15:04:05Z07:00
        expiryDate:
          type: string
          description: "Date when points expire. Possible values are:\n  - `unlimited`: Points have no expiration date.\n  - `timestamp value`: Points expire on the given date.\n"
          example: 2022-08-02T15:04:05Z07:00
        subledgerId:
          type: string
          description: ID of the subledger.
          maxLength: 64
          example: sub-123
        amount:
          type: number
          description: Amount of loyalty points added or deducted in the transaction.
          example: 10.25
        id:
          type: integer
          description: ID of the loyalty ledger transaction.
          example: 123
        rulesetId:
          type: integer
          description: The ID of the ruleset containing the rule that triggered this effect.
          example: 11
        ruleName:
          type: string
          description: The name of the rule that triggered this effect.
          example: Add 2 points
        validityDuration:
          type: string
          description: 'The duration for which the points remain active, relative to the  activation date.


            **Note**: This only applies to points for which `awaitsActivation` is `true` and `expiryDate` is not set.

            '
          example: 30D
    UpdateLoyaltyCard:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: 'Status of the loyalty card. Can be `active` or `inactive`.

            '
          example: active
        blockReason:
          type: string
          description: 'Reason for transferring and blocking the loyalty card.

            '
          example: Current card lost. Customer needs a new card.
    LoyaltyProgramEntity:
      type: object
      required:
      - programID
      properties:
        programID:
          type: integer
          description: The ID of the loyalty program that owns this entity.
          example: 125
        programName:
          type: string
          description: The integration name of the loyalty program that owns this entity.
          example: Loyalty_program
        programTitle:
          type: string
          description: The Campaign Manager-displayed name of the loyalty program that owns this entity.
          example: Loyalty program
    LedgerInfo:
      allOf:
      - $ref: '#/components/schemas/LoyaltyProgramBalance'
      - type: object
        properties:
          currentTier:
            $ref: '#/components/schemas/Tier'
            description: Tier for which the ledger is eligible.
            example: bronze
          pointsToNextTier:
            type: number
            description: Points required to move up a tier.
            example: 20
          nextTierName:
            type: string
            description: 'The name of the next higher tier level in the loyalty program.


              **Note**:

              - Returns `null` if the customer has reached the highest available tier.

              - Returns the lowest level tier name if the customer is not currently assigned to any tier.

              '
            example: Silver
    LoyaltyCard:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - $ref: '#/components/schemas/LoyaltyProgramEntity'
      - $ref: '#/components/schemas/UpdateLoyaltyCard'
      - type: object
        required:
        - identifier
        - usersPerCardLimit
        properties:
          identifier:
            $ref: '#/components/schemas/LoyaltyCardIdentifier'
          usersPerCardLimit:
            type: integer
            minimum: 0
            example: 111
            description: 'The max amount of customer profiles that can be linked to the card. 0 means unlimited.

              '
          profiles:
            type: array
            description: Integration IDs of the customers profiles linked to the card.
            items:
              $ref: '#/components/schemas/LoyaltyCardProfileRegistration'
          ledger:
            $ref: '#/components/schemas/LedgerInfo'
            description: Displays point balances of the card in the main ledger of the loyalty program.
          subledgers:
            type: object
            description: Displays point balances of the card in the subledgers of the loyalty program.
            additionalProperties:
              $ref: '#/components/schemas/LedgerInfo'
          modified:
            type: string
            format: date-time
            description: Timestamp of the most recent update of the loyalty card.
            example: '2021-09-12T10:12:42Z'
          oldCardIdentifier:
            $ref: '#/components/schemas/LoyaltyCardIdentifier'
            description: The identifier of the card from which the points were transferred.
            example: summer-loyalty-card-0543
          newCardIdentifier:
            $ref: '#/components/schemas/LoyaltyCardIdentifier'
            description: The identifier of the card to which the points were transferred.
            example: autumn-loyalty-card-5822
          batchId:
            description: The ID of the batch in which the loyalty card was created.
            type: string
            example: wdefpov
    LoyaltyProgramBalance:
      type: object
      required:
      - currentBalance
      - pendingBalance
      - expiredBalance
      - spentBalance
      - tentativeCurrentBalance
      description: The balance in a Loyalty Program for some Customer.
      properties:
        currentBalance:
          type: number
          title: Current balance
          description: Sum of currently active points.
          example: 100
        pendingBalance:
          type: number
          title: Pending balance
          description: Sum of pending points.
          example: 10
        negativeBalance:
          type: number
          title: Negative balance
          description: Sum of negative points. This implies that `currentBalance` is `0`.
          example: 10
        expiredBalance:
          type: number
          deprecated: true
          title: Expired balance
          description: '**DEPRECATED** Value is shown as 0.

            '
          example: 0
        spentBalance:
          type: number
          deprecated: true
          title: Spent balance
          description: '**DEPRECATED** Value is shown as 0.

            '
          example: 0
        tentativeCurrentBalance:
          type: number
          title: Tentative current balance
          description: 'The tentative points balance, reflecting the `currentBalance` and all point additions and deductions within the current open customer session. When the session is closed, the effects are applied and the `currentBalance` is updated to this value.


            **Note:** Tentative balances are specific to the current session and do not take into account other open sessions for the given customer.

            '
          example: 100
        tentativePendingBalance:
          type: number
          title: Tentative pending balance
          description: 'The tentative points balance, reflecting the `pendingBalance` and all point additions with a future activation date within the current open customer session. When the session is closed, the effects are applied and the `pendingBalance` is updated to this value.


            **Note:** Tentative balances are specific to the current session and do not take into account other open sessions for the given customer.

            '
          example: 20
        tentativeNegativeBalance:
          type: number
          title: Tentative negative balance
          description: 'The tentative negative balance after all additions and deductions from the current customer session are applied to `negativeBalance`. When the session is closed, the tentative effects are applied and `negativeBalance` is updated to this value.


            **Note:** Tentative balances are specific to the current session and do not take into account other open sessions for the given customer.

            '
          example: 100
    APIError:
      type: object
      required:
      - source
      - title
      properties:
        title:
          type: string
          description: Short description of the problem.
        details:
          type: string
          description: Longer description of this specific instance of the problem.
        source:
          $ref: '#/components/schemas/ErrorSource'
    Entity:
      type: object
      required:
      - id
      - created
      properties:
        id:
          type: integer
          description: The internal ID of this entity.
          example: 6
        created:
          type: string
          format: date-time
          description: The time this entity was created.
          example: '2020-06-10T09:05:27.993483Z'
    LoyaltyCardProfileRegistration:
