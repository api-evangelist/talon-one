          format: date-time
      - name: valid
        in: query
        description: 'Either "expired", "validNow", or "validFuture". The first option matches coupons in which the expiration date is set and in the past. The second matches coupons in which start date is null or in the past and expiration date is null or in the future, the third matches coupons in which start date is set and in the future.

          '
        example: validNow
        required: false
        schema:
          type: string
          enum:
          - expired
          - validNow
          - validFuture
      - name: usable
        in: query
        description: 'Either "true" or "false". If "true", only coupons where `usageCounter < usageLimit` will be returned, "false" will return only coupons where `usageCounter >= usageLimit`.

          '
        example: 'false'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: referralId
        in: query
        description: Filter the results by matching them with the ID of a referral. This filter shows the coupons created by redeeming a referral code.
        example: 47
        required: false
        schema:
          type: integer
      - name: recipientIntegrationId
        in: query
        description: Filter results by match with a profile id specified in the coupon's RecipientIntegrationId field.
        example: customer1
        required: false
        schema:
          type: string
      - name: batchId
        in: query
        description: Filter results by batches of coupons
        example: nfinccze
        required: false
        schema:
          type: string
      - name: exactMatch
        in: query
        description: Filter results to an exact case-insensitive matching against the coupon code.
        example: false
        required: false
        schema:
          type: boolean
          default: false
      - name: dateFormat
        in: query
        description: Determines the format of dates in the export document.
        example: excel
        required: false
        schema:
          type: string
          enum:
          - excel
          - ISO8601
      - name: campaignState
        in: query
        description: 'Filter results by the state of the campaign.


          - `enabled`: Campaigns that are scheduled, running (activated), or expired.

          - `running`: Campaigns that are running (activated).

          - `disabled`: Campaigns that are disabled.

          - `expired`: Campaigns that are expired.

          - `archived`: Campaigns that are archived.

          '
        example: enabled
        required: false
