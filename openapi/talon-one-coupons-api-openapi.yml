      - name: deletedBefore
        in: query
        description: 'Timestamp that filters the results to only contain coupons deleted before this date. Must be an RFC3339 timestamp string. You can use any time zone setting. Talon.One will convert to UTC internally.


          **Note:** Only coupons deleted in the last 7 days will appear in the results.'
        required: false
