            enum:
              - customerSession
              - customerProfile
              - coupons
              - triggeredCampaigns
              - referral
              - loyalty
              - event
              - awardedGiveaways
              - ruleFailureReasons
              - previousReturns
              - campaignEligibility
              - achievements
    CustomerProfileEntity:
