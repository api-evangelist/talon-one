        - $ref: '#/components/schemas/CheckCouponBlock'
        - $ref: '#/components/schemas/CheckReferralBlock'
        - $ref: '#/components/schemas/UpdateAudienceMembershipBlock'
        - $ref: '#/components/schemas/UpdateAchievementProgressBlock'
        - $ref: '#/components/schemas/UpdateAttributeValueBlock'
        - $ref: '#/components/schemas/TriggerWebhookBlock'
        - $ref: '#/components/schemas/TriggerCustomEffectBlock'
        - $ref: '#/components/schemas/CheckEventBlock'
        - $ref: '#/components/schemas/CheckAchievementBlock'
        - $ref: '#/components/schemas/CheckBudgetBlock'
        - $ref: '#/components/schemas/CreateCouponBlock'
        - $ref: '#/components/schemas/CreateReferralBlock'
        - $ref: '#/components/schemas/ReserveCouponBlock'
      discriminator:
        propertyName: type
        mapping:
          group: '#/components/schemas/PromotionGroupBlock'
          awardDiscount: '#/components/schemas/AwardDiscountBlock'
          passthrough: '#/components/schemas/PassthroughBlock'
          showNotification: '#/components/schemas/ShowNotificationBlock'
          awardItem: '#/components/schemas/AwardItemBlock'
          awardGiveaway: '#/components/schemas/AwardGiveawayBlock'
          triggerWebhook: '#/components/schemas/TriggerWebhookBlock'
          checkAttribute: '#/components/schemas/PromotionCheckAttributeBlock'
          checkAudience: '#/components/schemas/CheckAudienceBlock'
          checkLoyaltyBalance: '#/components/schemas/CheckLoyaltyBalanceBlock'
          checkCoupon: '#/components/schemas/CheckCouponBlock'
          checkReferral: '#/components/schemas/CheckReferralBlock'
          updateAudienceMembership: '#/components/schemas/UpdateAudienceMembershipBlock'
          updateAchievementProgress: '#/components/schemas/UpdateAchievementProgressBlock'
          updateAttributeValue: '#/components/schemas/UpdateAttributeValueBlock'
          triggerCustomEffect: '#/components/schemas/TriggerCustomEffectBlock'
          checkEvent: '#/components/schemas/CheckEventBlock'
          checkAchievement: '#/components/schemas/CheckAchievementBlock'
          checkBudget: '#/components/schemas/CheckBudgetBlock'
          createCoupon: '#/components/schemas/CreateCouponBlock'
          createReferral: '#/components/schemas/CreateReferralBlock'
          reserveCoupon: '#/components/schemas/ReserveCouponBlock'
    PromotionGroupBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: PromotionGroupBlock
          description: A structural combinator block that groups child promotion blocks using a logical operator. Evaluates to true when its operator condition is satisfied across all child blocks.
          required:
            - operator
            - blocks
          properties:
            operator:
              type: string
              enum:
                - all
                - atLeastOne
                - none
              description: Logical operator applied across child blocks. `all` requires every child to pass, `atLeastOne` requires at least one, `none` requires all to fail.
            blocks:
              type: array
              description: Child blocks evaluated according to the operator.
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    AwardDiscountCartTarget:
      type: object
      title: AwardDiscountCartTarget
      description: Applies the discount to the entire cart as a single unit.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - cart
          description: A target discriminator of type `cart`.
    AwardDiscountAllItemsTarget:
      type: object
      title: AwardDiscountAllItemsTarget
      description: Applies the discount across all cart items.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - allItems
          description: A target discriminator of type `allItems`.
        prorated:
          type: boolean
          description: Whether to distribute the discount proportionally across the targeted items.
          example: true
    AwardDiscountGlobalFilterTarget:
      type: object
      title: AwardDiscountGlobalFilterTarget
      description: Applies the discount to items matched by a named Application-level cart-item filter.
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - globalFilter
          description: A target discriminator of type `globalFilter`.
        name:
          type: string
          description: The name of the Application-level cart-item filter the discount targets.
          example: PremiumItems
        prorated:
          type: boolean
          description: Whether to distribute the discount proportionally across the matched items.
          example: false
    AwardDiscountSelectorTarget:
      type: object
      title: AwardDiscountSelectorTarget
      description: Applies the discount to items matched by a named selector binding.
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - selector
          description: A target discriminator of type `selector`.
        name:
          type: string
          description: The name of the selector binding the discount targets.
          example: ElectronicsItems
        prorated:
          type: boolean
          description: Whether to distribute the discount proportionally across the selected items.
          example: false
    AwardDiscountBundleItemByIndex:
      type: object
      title: AwardDiscountBundleItemByIndex
      description: Identifies a bundle slot by its zero-based index within the bundle.
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - byIndex
          description: A bundle-item selector of type `byIndex`.
        value:
          type: integer
          format: int64
          description: The zero-based index of the slot within the bundle.
          example: 0
    AwardDiscountBundleItemByAttribute:
      type: object
      title: AwardDiscountBundleItemByAttribute
      description: Identifies a bundle slot by ranking items by a per-item attribute expression and picking the highest- or lowest-ranked one.
      required:
        - type
        - attribute
        - direction
      properties:
        type:
          type: string
          enum:
            - byAttribute
          description: A bundle-item selector of type `byAttribute`.
        attribute:
          type: string
          description: A per-item attribute expression used to rank bundle items.
          example: '{{$Item.Price}}'
        direction:
          type: string
          enum:
            - highest
            - lowest
          description: Ranking direction. `highest` picks the item with the largest attribute value, `lowest` the smallest.
          example: highest
    AwardDiscountBundleItem:
      description: Selects which slot inside a bundle a discount applies to. The `type` field picks the selection mode.
      oneOf:
        - $ref: '#/components/schemas/AwardDiscountBundleItemByIndex'
        - $ref: '#/components/schemas/AwardDiscountBundleItemByAttribute'
      discriminator:
        propertyName: type
        mapping:
          byIndex: '#/components/schemas/AwardDiscountBundleItemByIndex'
          byAttribute: '#/components/schemas/AwardDiscountBundleItemByAttribute'
    AwardDiscountBundleTarget:
      type: object
      title: AwardDiscountBundleTarget
      description: Applies the discount to items belonging to a named bundle.
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - bundle
          description: A target discriminator of type `bundle`.
        name:
          type: string
          description: Name of the bundle binding the discount targets.
          example: BogoBundle
        item:
          $ref: '#/components/schemas/AwardDiscountBundleItem'
        prorated:
          type: boolean
          description: Whether to distribute the discount proportionally across the bundle's items.
          example: false
    AdditionalCostReference:
      type: object
      title: AdditionalCostReference
      description: Identifies an additional cost referenced from a rule.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: The internal identifier of the additional cost.
          example: 42
        name:
          type: string
          description: The additional cost name as used in API requests.
          example: shipping
        title:
          type: string
          description: The human-readable title of the additional cost.
          example: Shipping
    AwardDiscountAdditionalCostTarget:
      type: object
      title: AwardDiscountAdditionalCostTarget
      description: Applies the discount to an additional cost. The `target` field determines which subset of cart items the additional cost contribution is applied to.
      required:
        - type
        - additionalCost
        - target
      properties:
        type:
          type: string
          enum:
            - additionalCost
          description: A target discriminator of type `additionalCost`.
        additionalCost:
          $ref: '#/components/schemas/AdditionalCostReference'
        target:
          description: A subset of cart items whose additional cost the discount applies to. Cannot be another `additionalCost` target.
          oneOf:
            - $ref: '#/components/schemas/AwardDiscountCartTarget'
            - $ref: '#/components/schemas/AwardDiscountAllItemsTarget'
            - $ref: '#/components/schemas/AwardDiscountGlobalFilterTarget'
            - $ref: '#/components/schemas/AwardDiscountSelectorTarget'
          discriminator:
            propertyName: type
            mapping:
              cart: '#/components/schemas/AwardDiscountCartTarget'
              allItems: '#/components/schemas/AwardDiscountAllItemsTarget'
              globalFilter: '#/components/schemas/AwardDiscountGlobalFilterTarget'
              selector: '#/components/schemas/AwardDiscountSelectorTarget'
    AwardDiscountTarget:
      description: Identifies the scope a discount applies to. The `type` field selects the concrete target variant.
      oneOf:
        - $ref: '#/components/schemas/AwardDiscountCartTarget'
        - $ref: '#/components/schemas/AwardDiscountAllItemsTarget'
        - $ref: '#/components/schemas/AwardDiscountGlobalFilterTarget'
        - $ref: '#/components/schemas/AwardDiscountSelectorTarget'
        - $ref: '#/components/schemas/AwardDiscountBundleTarget'
        - $ref: '#/components/schemas/AwardDiscountAdditionalCostTarget'
      discriminator:
        propertyName: type
        mapping:
          cart: '#/components/schemas/AwardDiscountCartTarget'
          allItems: '#/components/schemas/AwardDiscountAllItemsTarget'
          globalFilter: '#/components/schemas/AwardDiscountGlobalFilterTarget'
          selector: '#/components/schemas/AwardDiscountSelectorTarget'
          bundle: '#/components/schemas/AwardDiscountBundleTarget'
          additionalCost: '#/components/schemas/AwardDiscountAdditionalCostTarget'
    AwardDiscountBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: AwardDiscountBlock
          description: A block that grants a discount when its rule conditions evaluate to `true`. The `target` field determines what the discount applies to (the whole cart, a subset of items, a bundle, an additional cost, etc.); the `value` field is the discount amount.
          required:
            - name
            - value
            - target
            - partial
          properties:
            name:
              type: string
              description: The human-readable label attached to the discount.
              example: 10% Off
            value:
              description: Discount amount. Either a numeric scalar or a `{{expression}}` string that resolves to a number at evaluation time.
              oneOf:
                - type: number
                  example: 10
                - type: string
                  example: '{{$Session.CartTotal * 0.1}}'
            partial:
              type: boolean
              description: Whether to apply a partial discount when the requested value exceeds the configured budget.
              example: false
            target:
              $ref: '#/components/schemas/AwardDiscountTarget'
    PassthroughBlock:
      type: object
      title: PassthroughBlock
      description: A block representing a Talang expression that could not be mapped to a typed block. The expression is preserved in its raw Talang array form for diagnostic and round-trip purposes.
      required:
        - id
        - type
        - expression
      properties:
        id:
          type: string
          description: Unique identifier for this block.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type:
          type: string
          enum:
            - passthrough
          description: The type discriminator for this block.
        expression:
          type: array
          description: The raw Talang expression as an array. For a function call, the first element is the function name and subsequent elements are its arguments. For any other expression (for example a bare attribute path or a literal value), this is a single-element array containing that value.
          items: {}
    ShowNotificationBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: ShowNotificationBlock
          description: A block that displays a notification to the customer with a configurable type, title, and optional body message.
          required:
            - notificationType
            - title
          properties:
            notificationType:
              type: string
              description: The type of notification to display.
              example: Info
            title:
              type: string
              description: The notification heading shown to the customer.
              example: You earned a reward!
            body:
              type: string
              description: The notification body text. Supports template placeholders (e.g. "{{$Session.Total}}") evaluated at rule execution time.
              example: You saved $10 on your order.
            onFailure:
              type: array
              description: Blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    AwardItemBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: AwardItemBlock
          description: A block that awards a free cart item to the customer. The item is identified by SKU and name and has a configurable quantity.
          required:
            - sku
            - name
            - quantity
          properties:
            sku:
              type: string
              description: The stock keeping unit of the item to award.
              example: SKU1241028
            name:
              type: string
              description: The display name of the item to award.
              example: Free Tote Bag
            quantity:
              type: string
              description: The number of items to award. Supports template placeholders (e.g. "{{$Session.Total / 2}}") for dynamic quantities.
              example: '1'
            partial:
              type: boolean
              description: When set to `true`, applies a partial item reward if the remaining budget is insufficient to award the full reward.
              example: false
            onFailure:
              type: array
              description: Blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    AwardGiveawayBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: AwardGiveawayBlock
          description: A block that awards a giveaway item from a configured giveaway pool to the specified customer profile.
          required:
            - giveawayPool
            - profile
          properties:
            giveawayPool:
              type: object
              description: The giveaway pool from which an item is awarded.
              required:
                - id
                - name
              properties:
                id:
                  type: integer
                  description: The unique identifier of the giveaway pool.
                  example: 42
                name:
                  type: string
                  description: The display name of the giveaway pool.
                  example: Summer Campaign Pool
            profile:
              type: string
              enum:
                - Current
                - Advocate
              description: The customer profile to award the giveaway to. `Current` targets the customer in the current session; `Advocate` targets the person who invited their friend via referral program.
              example: Current
            onFailure:
              type: array
              description: Blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    TriggerWebhookBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: TriggerWebhookBlock
          description: A block that triggers a configured webhook and passes its required parameters.
          required:
            - webhook
          properties:
            webhook:
              type: object
              description: The webhook to trigger.
              required:
                - id
                - title
              properties:
                id:
                  type: integer
                  description: The unique identifier of the webhook.
                  example: 1
                title:
                  type: string
                  description: The display name of the webhook.
                  example: Thank you for your order.
            params:
              type: object
              additionalProperties: true
              description: The webhook's parameters, in configured order. Each property name is the parameter's title, lowercased with spaces replaced by underscores (for example, `Order ID` becomes `order_id`); falls back to `param_0`, `param_1`, and so on if a title is blank or collides with another.
              example:
                order_id: ORD-10293
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    CheckAttributeBlockBase:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckAttributeBlockBase
          description: |-
            Shared shape for attribute-comparison blocks: a single attribute evaluated by a named operator.
            The operator determines which additional fields are required:
            - `scalar` requires `value`.
            - `between` requires `min` and `max` values.
            - `list` requires `values`.
            - `list-with-count` requires `values` and `count`.
            - `unary` requires no extra fields.
          required:
            - operator
            - attribute
          properties:
            operator:
              type: string
              enum:
                - equals
                - not(equals)
                - lessThan
                - lessThanOrEqual
                - greaterThan
                - greaterThanOrEqual
                - between
                - contains
                - not(contains)
                - matchesRegexp
                - startsWith
                - endsWith
                - oneOf
                - not(oneOf)
                - inCollection
                - not(inCollection)
                - empty
                - not(empty)
                - exists
                - not(exists)
                - isTrue
                - isFalse
                - containsAtLeast
                - containsExactly
                - containsOneOf
                - containsNoneOf
                - containsAllOf
                - after
                - before
                - within
                - not(within)
              description: The comparison operator applied to the attribute.
              example: greaterThan
            attribute:
              description: The attribute path identifier (e.g. "$Session.Total").
              example: $Session.Total
            value:
              description: The comparison value for scalar operators.
              example: 100
            min:
              description: The minimum value allowed for the `between` operator.
              example: 10
            max:
              description: The maximum value allowed for the `between` operator.
              example: 100
            start:
              description: The start value for the `within` operator.
              example: '2021-09-22T22:00:00Z'
            end:
              description: The end value for the `within` operator.
              example: '2021-09-22T22:00:00Z'
            startInclusive:
              type: boolean
              description: When `true`, the `start` value is included in the range for the `within` operator.
              example: true
            endInclusive:
              type: boolean
              description: When `true`, the `end` value is included in the range for the `within` operator.
              example: true
            timezoneInsensitive:
              type: boolean
              description: Indicates whether the `within` operator ignores time zones and compares the wall-clock time only. When `false`, time zones are taken into account.
              example: false
            values:
              description: The set of values to match against for list operators.
            count:
              description: The count threshold for `containsAtLeast` and `containsExactly` operators.
              example: 2
    PromotionCheckAttributeBlock:
      allOf:
        - $ref: '#/components/schemas/CheckAttributeBlockBase'
        - type: object
          title: PromotionCheckAttributeBlock
          description: A `CheckAttributeBlock` valid in a promotion rule, where each `onFailure` block must itself be a valid promotion block.
          properties:
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckAudienceBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckAudienceBlock
          description: A block that checks whether a given customer profile is a member of an audience.
          required:
            - operator
            - profile
            - audience
          properties:
            operator:
              type: string
              enum:
                - member
                - not(member)
                - justJoined
                - justLeft
              description: An indicator of how the block compares its elements.
              example: member
            profile:
              type: string
              enum:
                - Current
                - Advocate
              description: The customer profile to check against the audience. `Current` targets the customer in the current session; `Advocate` targets the person who invited their friend via referral program.
              example: Current
            audience:
              type: object
              description: The audience to check the profile against.
              required:
                - id
                - name
              properties:
                id:
                  type: integer
                  description: The ID of the audience.
                  example: 42
                name:
                  type: string
                  description: The display name of the audience.
                  example: Travel audience
                integration:
                  type: string
                  description: |
                    The Talon.One-supported [3rd-party platform](https://docs.talon.one/docs/dev/technology-partners/overview) that this audience was created in.

                    For example, `mParticle`, `Segment`, `Shopify`, `Braze`, or `Iterable`.

                    **Note:** If you do not integrate with any of these platforms, do not use this property.
                  example: mparticle
                integrationId:
                  type: string
                  description: |
                    The ID of this audience in the third-party integration.

                    **Note:** To create an audience that doesn't come from a 3rd party platform, do not use this property.
                  example: 382370BKDB946
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckLoyaltyBalanceBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckLoyaltyBalanceBlock
          description: A block that checks a specific loyalty program's ledger or subledger balance against a numeric value.
          required:
            - operator
            - program
            - subledger
            - balance
            - value
          properties:
            operator:
              type: string
              enum:
                - equals
                - not(equals)
                - lessThan
                - lessThanOrEqual
                - greaterThan
                - greaterThanOrEqual
              description: An indicator of how the block compares the balance to the value.
              example: greaterThanOrEqual
            program:
              type: object
              description: The loyalty program whose ledger balance is checked.
              required:
                - id
                - name
                - title
              properties:
                id:
                  type: integer
                  description: The ID of the loyalty program.
                  example: 10
                name:
                  type: string
                  description: The internal name of the loyalty program.
                  example: MainProgram
                title:
                  type: string
                  description: The display name of the loyalty program.
                  example: Main Loyalty Program
            subledger:
              type: string
              description: The name of the subledger to check the balance of. Can be empty if this block checks the loyalty program's main ledger balance instead of a subledger.
              example: ''
            balance:
              type: string
              enum:
                - current
                - pending
                - negative
                - tentativeCurrent
              description: |-
                The type of balance to check:
                 - `current` is the sum of currently active points
                 - `pending` is the sum of pending points.
                 - `negative` is the sum of negative points.
                 - `tentativeCurrent` is the tentative points balance
                within the current open customer session.
              example: current
            value:
              type: number
              description: The numeric value to compare the balance against.
              example: 500
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckCouponBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckCouponBlock
          description: A block that validates the coupon code value and date.
          required:
            - redeem
          properties:
            redeem:
              type: boolean
              description: When `true`, the coupon code is redeemed.
              example: true
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckReferralBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckReferralBlock
          description: A block that validates the referral code value and date.
          required:
            - redeem
          properties:
            redeem:
              type: boolean
              description: When `true`, the referral code is redeemed.
              example: true
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    UpdateAudienceMembershipBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: UpdateAudienceMembershipBlock
          description: A block that adds a customer to or removes them from an audience.
          required:
            - operator
            - profile
            - audience
          properties:
            operator:
              type: string
              enum:
                - add
                - remove
              description: The action to perform.
              example: add
            profile:
              type: string
              enum:
                - Current
                - Advocate
              description: The customer profile to add or remove from the audience. `Current` targets the customer in the current session; `Advocate` targets the person who invited their friend via referral program.
              example: Current
            audience:
              type: object
              description: The audience to add the customer to or remove them from.
              required:
                - id
                - name
              properties:
                id:
                  type: integer
                  description: The ID of the audience.
                  example: 42
                name:
                  type: string
                  description: The display name of the audience.
                  example: Travel audience
                integration:
                  type: string
                  description: |
                    The Talon.One-supported [3rd-party platform](https://docs.talon.one/docs/dev/technology-partners/overview) that this audience was created in.

                    For example, `mParticle`, `Segment`, `Shopify`, `Braze`, or `Iterable`.

                    **Note:** If you do not integrate with any of these platforms, do not use this property.
                  example: mparticle
                integrationId:
                  type: string
                  description: |
                    The ID of this audience in the third-party integration.

                    **Note:** To create an audience that doesn't come from a 3rd party platform, do not use this property.
                  example: 382370BKDB946
    UpdateAchievementProgressBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: UpdateAchievementProgressBlock
          description: A block that updates the progress of a customer in an achievement.
          required:
            - operator
            - value
            - achievement
          properties:
            operator:
              type: string
              enum:
                - increaseBy
              example: increaseBy
            value:
              type: string
              description: The value to update the progress by. Supports template placeholders (e.g. "{{$Session.Total / 2}}") for dynamic quantities.
              example: '10'
            achievement:
              type: object
              description: The achievement to update.
              required:
                - id
                - name
                - title
                - target
              properties:
                id:
                  type: integer
                  description: The ID of the achievement.
                  example: 42
                name:
                  type: string
                  description: The internal name of the achievement used in API requests.
                  example: Order50Discount
                title:
                  type: string
                  description: The display name of the achievement in the Campaign Manager.
                  example: 50% off on 50th purchase.
                target:
                  type: number
                  description: The required number of actions or the transactional milestone to complete the achievement.
                  example: 50
    UpdateAttributeValueBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: UpdateAttributeValueBlock
          description: A block that sets or updates an attribute. The `type` may be empty for [built-in attributes](https://docs.talon.one/docs/dev/concepts/attributes).
          required:
            - operator
            - attribute
            - target
          properties:
            operator:
              type: string
              enum:
                - setTo
                - increaseBy
                - decreaseBy
                - multiplyBy
                - divideBy
                - toggle
                - laterBy
                - earlierBy
              description: The update operation applied to the attribute.
              example: setTo
            attribute:
              type: object
              required:
                - id
                - entity
                - name
                - title
                - type
              description: The attribute being updated.
              properties:
                id:
                  type: integer
                  description: The internal ID of the attribute. Reverts to `0` when the attribute is deleted or does not exist.
                  example: 100
                entity:
                  type: string
                  description: The entity type that owns the attribute. Reverts to an empty string when the attribute is deleted or does not exist.
                  example: profile
                name:
                  type: string
                  description: The attribute name as used in API requests.
                  example: City
                title:
                  type: string
                  description: The human-readable name of the attribute.
                  example: City
                type:
                  type: string
                  description: The data type of the attribute.
                  example: string
            value:
              description: The value of the attribute. Omitted when operator is set to `toggle`.
              example: 10
            target:
              type: object
              required:
                - type
              description: The entity or item scope that this effect operates on.
              properties:
                type:
                  type: string
                  enum:
                    - session
                    - profile
                    - advocateProfile
                    - coupon
                    - referral
                    - allItems
                    - selector
                    - globalFilter
                  description: Identifies the target scope of the attribute update.
                  example: profile
                name:
                  type: string
                  description: Identifies the name of the target when its type is set to `selector` or `globalFilter`.
                  example: Filter items by product
            tags:
              type: array
              description: Semantic labels attached to this block.
              items:
                type: string
    TriggerCustomEffectBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: TriggerCustomEffectBlock
          description: A block that triggers a configured custom effect and passes its required parameters.
          required:
            - customEffect
            - target
          properties:
            customEffect:
              type: object
              description: The custom effect to trigger.
              required:
                - id
                - name
                - title
              properties:
                id:
                  type: integer
                  description: The unique identifier of the custom effect.
                  example: 1
                name:
                  type: string
                  description: The name of the custom effect, as used in API requests.
                  example: sendEmail
                title:
                  type: string
                  description: The display name of the custom effect.
                  example: Send email
            params:
              type: object
              additionalProperties: true
              description: The custom effect's parameters, in configured order. Each property name is the parameter's title, lowercased with spaces replaced by underscores (for example, `Order ID` becomes `order_id`); falls back to `param_0`, `param_1`, and so on if a title is blank or collides with another.
              example:
                template_id: TPL-10293
            target:
              type: object
              required:
                - type
              description: The target scope of this effect.
              properties:
                type:
                  type: string
                  enum:
                    - cart
                    - allItems
                    - selector
                    - globalFilter
                    - bundle
                  description: 'The scope the custom effect applies to: - `cart` applies once to the whole cart. - `allItems` applies once per cart item. - `selector` applies once per item matched by the named selector. - `globalFilter` applies once per item matched by the named global item filter. - `bundle` applies once per item in the named bundle.'
                  example: cart
                name:
                  type: string
                  description: The name of the targeted selector or bundle. Only set when `type` is `selector`, `globalFilter`, or `bundle`.
                  example: giftBundle
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionBlock'
    CheckEventBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckEventBlock
          description: A block that validates the event type.
          required:
            - eventType
          properties:
            eventType:
              type: string
              description: The event type to check against.
              example: profileCreated
            matchers:
              type: array
              items:
                $ref: '#/components/schemas/PromotionBlock'
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckAchievementBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckAchievementBlock
          description: A block that checks the current customer's completion or progress status in an achievement.
          required:
            - operator
            - achievement
          properties:
            operator:
              type: string
              enum:
                - justCompleted
                - started
                - not(started)
                - inProgress
                - not(inProgress)
                - completed
                - not(completed)
              description: The comparison operator applied to the achievement.
              example: justCompleted
            achievement:
              type: object
              description: The achievement to check for.
              required:
                - id
                - title
                - name
                - target
              properties:
                id:
                  type: integer
                  description: The ID of the achievement.
                  example: 42
                title:
                  type: string
                  description: The display name for the achievement in the Campaign Manager.
                  example: 50% off on 50th purchase.
                name:
                  type: string
                  description: The internal name of the achievement used in API requests.
                  example: Order50Discount
                target:
                  type: number
                  description: The required number of actions or the transactional milestone to complete the achievement.
                  example: 50
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CheckBudgetBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CheckBudgetBlock
          description: A block that verifies if a specific budget has sufficient limit available, and whether this limit meets or exceeds a specific value.
          required:
            - operator
            - action
          properties:
            operator:
              type: string
              enum:
                - available
                - enoughFor
              description: The comparison operator applied to the limit. `available` checks if there is budget available for a given limitable action; `enoughFor` checks if the available budget meets or exceeds a specific value limit.
              example: available
            action:
              type: string
              enum:
                - redeemCoupon
                - redeemReferral
                - setDiscount
                - createCoupon
                - createReferral
                - setDiscountEffect
                - createLoyaltyPoints
                - createLoyaltyPointsEffect
                - redeemLoyaltyPoints
                - redeemLoyaltyPointsEffect
                - awardGiveaway
                - addFreeItemEffect
                - customEffect
                - callApi
              description: The limitable action to check.
              example: setDiscount
            value:
              type: number
              description: The value to check against when using the `enoughFor` operator.
              example: 5
            onFailure:
              type: array
              description: Promotion blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    CreateCouponBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CreateCouponBlock
          description: A block that creates a coupon code.
          required:
            - campaignId
            - recipientId
            - storeInSession
          properties:
            campaignId:
              description: The ID of the campaign in which the coupon code is created.
              oneOf:
                - type: number
                  example: 3
                - type: string
                  example: '{{$Campaign.Id}}'
            recipientId:
              type: string
              description: The integration ID of the customer that is allowed to redeem this coupon.
              example: '{{$Profile.IntegrationId}}'
            storeInSession:
              type: boolean
              description: When `true`, the coupon is stored in the session.
              example: true
            usageLimit:
              description: |
                The number of times the coupon code can be redeemed. `0` means unlimited redemptions, but any campaign usage limits still apply. Either a numeric scalar or a `{{expression}}` string that resolves to a number at evaluation time.
              oneOf:
                - type: number
                  example: 100
                - type: string
                  example: '{{$Session.CartTotal * 0.1}}'
            discountLimit:
              description: |
                The total discount value that the code can give. Typically used to represent a gift card value. Either a numeric scalar or a `{{expression}}` string that resolves to a number at evaluation time.
              oneOf:
                - type: number
                  example: 30
                - type: string
                  example: '{{$Session.CartTotal * 0.1}}'
            startDate:
              description: Timestamp at which point the coupon becomes valid.
              example: '2024-12-24T14:15:22Z'
            expiryDate:
              description: Expiration date of the coupon. Coupon never expires if this is omitted.
              example: '2024-12-24T14:15:22Z'
            attributes:
              description: Custom attributes associated with this coupon code.
            validCharacters:
              type: string
              description: Characters used to generate the random parts of a code.
              example: ABC
            pattern:
              type: string
              description: |
                The pattern used to generate codes, such as coupon codes, referral codes, and loyalty cards. The character `#` is a placeholder and is replaced by a random character from the `validCharacters` set.
              example: SUMMER-####-####
    CreateReferralBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: CreateReferralBlock
          description: A block that creates a referral code.
          required:
            - campaignId
            - friendId
            - storeInSession
          properties:
            campaignId:
              description: The ID of the campaign in which the referral code is created. Either a numeric scalar or a `{{expression}}` string that resolves to a number at evaluation time.
              oneOf:
                - type: number
                  example: 3
                - type: string
                  example: '{{$Campaign.Id}}'
            friendId:
              type: string
              description: An optional integration ID of the friend's profile.
              example: '{{$Profile.IntegrationId}}'
            storeInSession:
              type: boolean
              description: When `true`, the referral code is stored in the session.
              example: true
            usageLimit:
              description: |
                The number of times the referral code code can be redeemed. `0` means unlimited redemptions, but any campaign usage limits still apply. Either a numeric scalar or a `{{expression}}` string that resolves to a number at evaluation time.
              oneOf:
                - type: number
                  example: 100
                - type: string
                  example: '{{$Session.CartTotal * 0.1}}'
            startDate:
              description: Timestamp at which point the referral code becomes valid.
              example: '2024-12-24T14:15:22Z'
            expiryDate:
              description: Expiration date of the referral code. Referral code never expires if this is omitted.
              example: '2024-12-24T14:15:22Z'
            attributes:
              description: Custom attributes associated with this referral code.
            validCharacters:
              type: string
              description: Characters used to generate the random parts of a code.
              example: ABC
            pattern:
              type: string
              description: |
                The pattern used to generate codes, such as coupon codes, referral codes, and loyalty cards. The character `#` is a placeholder and is replaced by a random character from the `validCharacters` set.
              example: SUMMER-####-####
    ReserveCouponBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: ReserveCouponBlock
          description: A block that reserve a coupon during a customer session.
    PromotionRuleV2:
      allOf:
        - $ref: '#/components/schemas/RuleV2'
        - type: object
          title: PromotionRuleV2
          description: A single promotion rule in V2 block format.
          required:
            - blocks
          properties:
            blocks:
              type: array
              description: The condition and effect blocks that make up this promotion rule.
              items:
                $ref: '#/components/schemas/PromotionBlock'
    StrikethroughBlock:
      description: A block valid in a strikethrough rule. The `type` field identifies the concrete block type.
      oneOf:
        - $ref: '#/components/schemas/StrikethroughGroupBlock'
        - $ref: '#/components/schemas/AwardDiscountBlock'
        - $ref: '#/components/schemas/PassthroughBlock'
        - $ref: '#/components/schemas/StrikethroughCheckAttributeBlock'
      discriminator:
        propertyName: type
        mapping:
          group: '#/components/schemas/StrikethroughGroupBlock'
          awardDiscount: '#/components/schemas/AwardDiscountBlock'
          passthrough: '#/components/schemas/PassthroughBlock'
          checkAttribute: '#/components/schemas/StrikethroughCheckAttributeBlock'
    StrikethroughGroupBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: StrikethroughGroupBlock
          description: A structural combinator block that groups child strikethrough blocks using a logical operator. Evaluates to true when its operator condition is satisfied across all child blocks.
          required:
            - operator
            - blocks
          properties:
            operator:
              type: string
              enum:
                - all
                - atLeastOne
                - none
              description: Logical operator applied across child blocks. `all` requires every child to pass, `atLeastOne` requires at least one, `none` requires all to fail.
            blocks:
              type: array
              description: Child blocks evaluated according to the operator.
              items:
                $ref: '#/components/schemas/StrikethroughBlock'
            onFailure:
              type: array
              description: Strikethrough blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/StrikethroughBlock'
            onError:
              type: object
              description: Named error handlers evaluated when a specific error occurs.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/StrikethroughBlock'
    StrikethroughCheckAttributeBlock:
      allOf:
        - $ref: '#/components/schemas/CheckAttributeBlockBase'
        - type: object
          title: StrikethroughCheckAttributeBlock
          description: A `CheckAttributeBlock` valid in a strikethrough rule, where each `onFailure` block must itself be a valid strikethrough block.
          properties:
            onFailure:
              type: array
              description: Strikethrough blocks evaluated when this block fails or returns false.
              items:
                $ref: '#/components/schemas/StrikethroughBlock'
    StrikethroughRuleV2:
      allOf:
        - $ref: '#/components/schemas/RuleV2'
        - type: object
          title: StrikethroughRuleV2
          description: A single strikethrough rule.
          required:
            - blocks
          properties:
            blocks:
              type: array
              description: The condition and effect blocks that make up this strikethrough rule.
              items:
                $ref: '#/components/schemas/StrikethroughBlock'
    ScalarCheckAttributeBlock:
      type: object
      title: ScalarCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for operators that compare an attribute against a single value.
      required:
        - value
      properties:
        operator:
          type: string
          description: The comparison operator applied to the attribute.
          enum:
            - equals
            - not(equals)
            - lessThan
            - lessThanOrEqual
            - greaterThan
            - greaterThanOrEqual
            - contains
            - not(contains)
            - matchesRegexp
            - startsWith
            - endsWith
            - oneOf
            - not(oneOf)
            - inCollection
            - not(inCollection)
            - after
            - before
        value:
          description: The comparison value for this operator.
          example: 100
    BetweenCheckAttributeBlock:
      type: object
      title: BetweenCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for the `between` operator, which requires both a minimum and maximum value.
      required:
        - min
        - max
      properties:
        operator:
          type: string
          description: The range comparison operator. Must be `between`.
          enum:
            - between
        min:
          description: The minimum value allowed for the `between` operator.
          example: 10
        max:
          description: The maximum value allowed for the `between` operator.
          example: 100
    ListCheckAttributeBlock:
      type: object
      title: ListCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for operators that test list membership against a set of values.
      required:
        - values
      properties:
        operator:
          type: string
          description: The list membership operator applied to the attribute.
          enum:
            - containsOneOf
            - containsNoneOf
            - containsAllOf
        values:
          description: The set of values to match against.
    ListWithCountCheckAttributeBlock:
      type: object
      title: ListWithCountCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for operators that test list membership with a minimum or exact count threshold.
      required:
        - values
        - count
      properties:
        operator:
          type: string
          description: The list membership operator with a count threshold applied to the attribute.
          enum:
            - containsAtLeast
            - containsExactly
        values:
          description: The set of values to match against.
        count:
          description: The count threshold for this operator.
          example: 2
    UnaryCheckAttributeBlock:
      type: object
      title: UnaryCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for operators that test a property of the attribute itself with no comparison value.
      properties:
        operator:
          type: string
          description: The unary operator applied to the attribute. These operators require no comparison value.
          enum:
            - empty
            - not(empty)
            - exists
            - not(exists)
            - isTrue
            - isFalse
    WithinCheckAttributeBlock:
      type: object
      title: WithinCheckAttributeBlock
      description: Variant of `CheckAttributeBlock` for the `within` and `not(within)` operators, which require both a start and end value.
      required:
        - start
        - end
      properties:
        operator:
          type: string
          description: The range comparison operator. Must be `within` or `not(within)`.
          enum:
            - within
            - not(within)
        start:
          description: The start value for the `within` operator.
          example: '2021-09-22T22:00:00Z'
        end:
          description: The end value for the `within` operator.
          example: '2021-09-22T22:00:00Z'
        startInclusive:
          type: boolean
          description: When `true`, the `start` value is included in the range for the `within` operator.
          example: true
        endInclusive:
          type: boolean
          description: When `true`, the `end` value is included in the range for the `within` operator.
          example: true
        timezoneInsensitive:
          type: boolean
          description: Indicates whether the `within` operator ignores time zones and compares the wall-clock time only. When `false`, time zones are taken into account.
          example: false
    CheckAttributeBlock:
      allOf:
        - $ref: '#/components/schemas/CheckAttributeBlockBase'
      oneOf:
        - $ref: '#/components/schemas/ScalarCheckAttributeBlock'
        - $ref: '#/components/schemas/BetweenCheckAttributeBlock'
        - $ref: '#/components/schemas/ListCheckAttributeBlock'
        - $ref: '#/components/schemas/ListWithCountCheckAttributeBlock'
        - $ref: '#/components/schemas/UnaryCheckAttributeBlock'
        - $ref: '#/components/schemas/WithinCheckAttributeBlock'
      discriminator:
        propertyName: operator
        mapping:
          equals: '#/components/schemas/ScalarCheckAttributeBlock'
          not(equals): '#/components/schemas/ScalarCheckAttributeBlock'
          lessThan: '#/components/schemas/ScalarCheckAttributeBlock'
          lessThanOrEqual: '#/components/schemas/ScalarCheckAttributeBlock'
          greaterThan: '#/components/schemas/ScalarCheckAttributeBlock'
          greaterThanOrEqual: '#/components/schemas/ScalarCheckAttributeBlock'
          contains: '#/components/schemas/ScalarCheckAttributeBlock'
          not(contains): '#/components/schemas/ScalarCheckAttributeBlock'
          matchesRegexp: '#/components/schemas/ScalarCheckAttributeBlock'
          startsWith: '#/components/schemas/ScalarCheckAttributeBlock'
          endsWith: '#/components/schemas/ScalarCheckAttributeBlock'
          oneOf: '#/components/schemas/ScalarCheckAttributeBlock'
          not(oneOf): '#/components/schemas/ScalarCheckAttributeBlock'
          inCollection: '#/components/schemas/ScalarCheckAttributeBlock'
          not(inCollection): '#/components/schemas/ScalarCheckAttributeBlock'
          between: '#/components/schemas/BetweenCheckAttributeBlock'
          containsOneOf: '#/components/schemas/ListCheckAttributeBlock'
          containsNoneOf: '#/components/schemas/ListCheckAttributeBlock'
          containsAllOf: '#/components/schemas/ListCheckAttributeBlock'
          containsAtLeast: '#/components/schemas/ListWithCountCheckAttributeBlock'
          containsExactly: '#/components/schemas/ListWithCountCheckAttributeBlock'
          empty: '#/components/schemas/UnaryCheckAttributeBlock'
          not(empty): '#/components/schemas/UnaryCheckAttributeBlock'
          exists: '#/components/schemas/UnaryCheckAttributeBlock'
          not(exists): '#/components/schemas/UnaryCheckAttributeBlock'
          isTrue: '#/components/schemas/UnaryCheckAttributeBlock'
          isFalse: '#/components/schemas/UnaryCheckAttributeBlock'
          after: '#/components/schemas/ScalarCheckAttributeBlock'
          before: '#/components/schemas/ScalarCheckAttributeBlock'
          within: '#/components/schemas/WithinCheckAttributeBlock'
          not(within): '#/components/schemas/WithinCheckAttributeBlock'
    SelectorBlock:
      description: A predicate block valid inside a selector filter step. The `type` field determines the block variant.
      oneOf:
        - $ref: '#/components/schemas/CheckAttributeBlock'
        - $ref: '#/components/schemas/SelectorGroupBlock'
        - $ref: '#/components/schemas/PassthroughBlock'
      discriminator:
        propertyName: type
        mapping:
          checkAttribute: '#/components/schemas/CheckAttributeBlock'
          group: '#/components/schemas/SelectorGroupBlock'
          passthrough: '#/components/schemas/PassthroughBlock'
    SelectorGroupBlock:
      allOf:
        - $ref: '#/components/schemas/BaseBlock'
        - type: object
          title: SelectorGroupBlock
          description: A structural combinator block that groups child selector predicate blocks using a logical operator. Evaluates to `true` when its operator condition is satisfied across all child blocks.
          required:
            - operator
            - blocks
          properties:
            operator:
              type: string
              enum:
                - all
                - atLeastOne
                - none
              description: Logical operator applied across child blocks. `all` requires every child to pass, `atLeastOne` requires at least one, `none` requires all to fail.
              example: all
            blocks:
              type: array
              description: Child predicate blocks evaluated according to the operator.
              items:
                $ref: '#/components/schemas/SelectorBlock'
    FilterSelectorStep:
      type: object
      title: FilterSelectorStep
      description: Filters only items that match a predicate block.
      required:
        - type
        - predicate
      properties:
        type:
          type: string
          enum:
            - filter
          description: A step discriminator of type `filter`.
          example: filter
        predicate:
          $ref: '#/components/schemas/SelectorBlock'
    SortSelectorStepField:
      type: object
      title: SortSelectorStepField
      required:
        - expression
        - direction
      properties:
        expression:
          type: string
          description: The attribute path the items are sorted by.
          example: $Item.Price
        direction:
          type: string
          enum:
            - asc
            - desc
          description: The sort direction for this field.
          example: asc
    SortSelectorStep:
      type: object
      title: SortSelectorStep
      description: Sorts items by one or more field expressions.
      required:
        - type
        - fields
      properties:
        type:
          type: string
          enum:
            - sort
          description: A step discriminator of type `sort`.
          example: sort
        fields:
          type: array
          description: One or more fields to sort by, applied in order. Each field has its own direction.
          items:
            $ref: '#/components/schemas/SortSelectorStepField'
    SelectSelectorStep:
      type: object
      title: SelectSelectorStep
      description: 'Picks a subset of the items by count, range, or exact position. The `operator` determines which additional fields are required: - `many` selects items from `from` (`start` or `end`) and is limited by `count`. - `between` selects items between integer indices `from` and `to`. - `one` selects the single item at `index`.'
      required:
        - type
        - operator
      properties:
        type:
          type: string
          enum:
            - select
          description: A step discriminator of type `select`.
          example: select
        operator:
          type: string
          enum:
            - many
            - between
            - one
          description: The selection operator applied to the items.
          example: many
        from:
          description: The starting value of the selection. For the `many` operator this is the string `start` or `end`; for the `between` operator this is an integer start index. No discriminator is needed since the string and integer branches are distinguishable by JSON type alone.
          oneOf:
            - type: string
              enum:
                - start
                - end
              example: start
            - type: integer
              format: int32
              example: 2
        to:
          type: integer
          format: int32
          description: The end index for the `between` operator. The item at this index is not included.
          example: 7
        count:
          type: integer
          format: int32
          description: The maximum number of items to select for the `many` operator.
          example: 5
        index:
          type: integer
          format: int32
          description: The exact position of the item to select for the `one` operator.
          example: 0
        partial:
          type: boolean
          description: Indicates if the step returns fewer items than requested when the source list is shorter than the range needs. Always `true` for the `many` and `between` operators; not present for `one`, which fails instead of returning a partial result.
          example: true
    MapSelectorStep:
      type: object
      title: MapSelectorStep
      description: Transforms each item using an expression.
      required:
        - type
        - expression
      properties:
        type:
          type: string
          enum:
            - map
          description: A step discriminator of type `map`.
          example: map
        expression:
          type: string
          description: The attribute path each item is mapped to.
          example: $Item.Price
    ReduceSelectorStep:
      type: object
      title: ReduceSelectorStep
      description: Aggregates items into a single value.
      required:
        - type
        - operator
      properties:
        type:
          type: string
          enum:
            - reduce
          description: A step discriminator of type `reduce`.
          example: reduce
        operator:
          type: string
          enum:
            - max
            - min
            - sum
            - count
            - empty
          description: |
            The aggregation operator applied to the items produced by the preceding step:
            - `max`, `min`, and `sum` operate on numeric values.
            - `count` returns the number of items.
            - `empty` reports whether the list is empty.
          example: sum
    ReverseSelectorStep:
      type: object
      title: ReverseSelectorStep
      description: Reverses the order of the items.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - reverse
          description: A step discriminator of type `reverse`.
          example: reverse
    SelectorValueMapRef:
      type: object
      title: SelectorValueMapRef
      description: A reference to a value map by its internal ID.
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: The internal ID of the referenced value map.
          example: 12
    FilterAndMapValuesSelectorStep:
      type: object
      title: FilterAndMapValuesSelectorStep
      description: Keeps items that exist in the value map, and attaches each kept item's mapped value.
      required:
        - type
        - valueMap
      properties:
        type:
          type: string
          enum:
            - filterAndMapValues
          description: A step discriminator of type `filterAndMapValues`.
          example: filterAndMapValues
        valueMap:
          $ref: '#/components/schemas/SelectorValueMapRef'
    SelectorStep:
      description: A single step in a selector item pipeline. The `type` field determines the step variant.
      oneOf:
        - $ref: '#/components/schemas/FilterSelectorStep'
        - $ref: '#/components/schemas/SortSelectorStep'
        - $ref: '#/components/schemas/SelectSelectorStep'
        - $ref: '#/components/schemas/MapSelectorStep'
        - $ref: '#/components/schemas/ReduceSelectorStep'
        - $ref: '#/components/schemas/ReverseSelectorStep'
        - $ref: '#/components/schemas/FilterAndMapValuesSelectorStep'
      discriminator:
        propertyName: type
        mapping:
          filter: '#/components/schemas/FilterSelectorStep'
          sort: '#/components/schemas/SortSelectorStep'
          select: '#/components/schemas/SelectSelectorStep'
          map: '#/components/schemas/MapSelectorStep'
          reduce: '#/components/schemas/ReduceSelectorStep'
          reverse: '#/components/schemas/ReverseSelectorStep'
          filterAndMapValues: '#/components/schemas/FilterAndMapValuesSelectorStep'
    Selector:
      type: object
      title: Selector
      description: A named pipeline of steps (filter, sort, map, etc.) that filters or transforms a list of cart items. Replaces `cartItemFilter` [bindings](https://docs.talon.one/management-api#tag/Campaigns/operation/getRuleset.responses.200.bindings) in V1 rulesets.
      required:
        - name
        - type
        - source
        - steps
      properties:
        name:
          type: string
          description: The name of the selector binding.
          example: discountedCartItems
        type:
          type: string
          enum:
            - selector
          description: A binding of type `selector`.
          example: selector
        source:
          type: string
          description: The attribute path the pipeline draws items from.
          example: $Session.CartItems
        steps:
          type: array
          description: Ordered pipeline steps applied to the source items.
          items:
            $ref: '#/components/schemas/SelectorStep'
    RulesetV2:
      type: object
      title: RulesetV2
      description: Ruleset in the V2 JSON block format.
      required:
