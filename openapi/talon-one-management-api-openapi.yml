                - $ref: '#/components/schemas/AddFreeItemEffectProps'
                - $ref: '#/components/schemas/ShowNotificationEffectProps'
                - $ref: '#/components/schemas/UpdateAttributeEffectProps'
                - $ref: '#/components/schemas/RollbackCouponEffectProps'
