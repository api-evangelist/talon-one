            - title
            - description
            - target
            - recurrencePolicy
            - activationPolicy
            - sandbox
            - subscribedApplications
            - timezone
          properties:
            sandbox:
              type: boolean
              description: Indicates if this achievement is a live or sandbox achievement. Achievements of a given type can only be connected to Applications of the same type.
              title: Sandbox
              example: true
            timezone:
              type: string
              description: A string containing an IANA timezone descriptor.
              minLength: 1
              example: Europe/Berlin
    CreateAchievementV2:
      allOf:
        - $ref: '#/components/schemas/AchievementBaseV2'
        - type: object
          required:
            - name
            - title
            - description
            - target
            - timezone
            - sandbox
          properties:
            sandbox:
              type: boolean
              description: Indicates if this achievement is a live or sandbox achievement. Achievements of a given type can only be connected to Applications of the same type.
              title: Sandbox
              example: true
            timezone:
              type: string
              description: A string containing an IANA timezone descriptor.
              minLength: 1
              example: Europe/Berlin
