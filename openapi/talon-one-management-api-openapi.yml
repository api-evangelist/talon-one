          description: Indicates if a customer has made progress in the achievement.
        status:
          type: string
          enum:
            - active
            - scheduled
            - expired
          example: active
          description: |
            The status of the achievement.                                                                                              
            - `active`: The achievement is available to customers.
            - `scheduled`: The achievement has a `fixedStartDate` set in the future.
            - `expired`: The achievement's `endDate` is in the past.
    AchievementV2:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - $ref: '#/components/schemas/AchievementBaseV2'
        - $ref: '#/components/schemas/AchievementAdditionalPropertiesV2'
        - type: object
          required:
