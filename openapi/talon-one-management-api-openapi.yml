          type: string
          description: The SKU of the item for which the historical prices are being retrieved.
          example: SKU1241028
        startDate:
          type: string
          format: date-time
          description: The start date of the period for which historical prices should be retrieved.
          example: '2020-11-10T23:00:00Z'
        endDate:
          type: string
          format: date-time
          description: The end date of the period for which historical prices should be retrieved.
          example: '2020-12-10T23:00:00Z'
    History:
      type: object
      required:
        - id
        - observedAt
        - price
        - contextIds
        - metadata
        - target
      properties:
        id:
          type: integer
          description: The ID of the historical price.
          example: 1
        observedAt:
          type: string
          format: date-time
          description: The date and time when the price was observed.
          example: '2025-11-10T23:00:00Z'
        contextIds:
          type: array
          items:
            type: string
          description: |
            The identifiers of the relevant context at the time the price was observed. Includes the context IDs of any price adjustments and of the campaigns that influenced the final price.
          example:
            - SpringSale
            - SummerSale2025
        contextId:
          type: string
          deprecated: true
          default: ''
          description: |
            This property is **deprecated**. Use `contextIds` instead. Defaults to an empty string.
          example: ''
        price:
          type: number
          description: Price of the item.
          example: 99.99
        metadata:
          $ref: '#/components/schemas/BestPriorPriceMetadata'
        target:
          $ref: '#/components/schemas/LabelTarget'
        excludedAt:
          type: string
          format: date-time
          description: The date and time when the historical price ID was excluded.
          example: '2025-11-10T23:00:00Z'
        exclusionReason:
          type: string
          description: The reason for excluding this historical price ID.
          example: Incorrect contextID value
    PriceHistoryResponse:
      type: object
      required:
        - sku
        - history
      properties:
        sku:
          type: string
          description: The SKU of the item for which historical prices should be retrieved.
          example: SKU1241028
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
    ExcludePriceObservationsRequest:
      type: object
      required:
        - ids
        - reason
      properties:
        ids:
          description: |
            A list of historical price IDs to exclude from best prior price calculation. Must contain between 1 and 1000 IDs. All IDs must be valid `id` values obtained from the [Get summary of price history](https://docs.talon.one/management-api#tag/Catalogs/operation/priceHistory.responses.200.history) endpoint, must belong to the specified Application, and must not already be excluded from best prior price calculation.
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          minItems: 1
          uniqueItems: true
          maxItems: 1000
        reason:
          description: |
            The reason for excluding these historical price IDs. Applies to all IDs in the batch.
          type: string
          example: Incorrect contextID value.
          minLength: 1
