generated: '2026-08-13'
method: searched
source: https://docs.talon.one/docs/dev/mcp
provider: Talon.One
providerId: talon-one
name: Talon.One MCP server
status: published
description: 'Talon.One ships an official MCP server that gives agents secure, read-only access to the
  campaigns, customers, coupons and loyalty data in a Talon.One environment. Because Talon.One runs as
  a per-customer deployment, the endpoint is not a single shared URL: each environment exposes its own
  server at <deployment>/v1/mcp/entrypoint. Authentication uses a dedicated MCP connection API key created
  under Account > Tools > MCP Connections, and the server honours the account role permissions of that
  key.'
deployment:
  mode: remote
  endpoint: https://{deployment}.talon.one/v1/mcp/entrypoint
  endpoint_example: https://mycompany.europe-west1.talon.one/v1/mcp/entrypoint
  install: 'npx mcp-remote https://YOUR_DEPLOYMENT_URL/v1/mcp/entrypoint --header "Authorization: Bearer
    ${MCP_AUTH_TOKEN}"'
  package: https://www.npmjs.com/package/mcp-remote
  auth: api-key
  verified: searched
  note: 'Remote, not local-stdio: the server is an HTTPS endpoint inside the customer deployment. The
    npx command in the provider documentation is the generic mcp-remote bridge for clients that only speak
    stdio, not a Talon.One package. The endpoint could not be probed from outside because it is per-tenant
    and requires an account-issued key; the URL form above is quoted from the provider documentation and
    is not a guess.'
authentication:
  type: api-key
  header: 'Authorization: Bearer <MCP connection API key>'
  issuance: Campaign Manager > Account > Tools > MCP Connections > Create Key (admin rights required;
    key has an expiration date and is shown once).
  permissions: Inherits the account role permissions of the creating admin.
  docs: https://docs.talon.one/docs/product/account/account-settings/manage-roles
access: read-only
