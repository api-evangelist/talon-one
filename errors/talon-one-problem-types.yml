description: 'Talon.One returns every API error as a JSON object with a top-level `message` property and
  an optional `errors` array of individual problems. Talon.One describes the shape as "the same as that
  described by JSON API" in its error reference, but it does not use the `application/problem+json` media
  type or RFC 9457 members (type/title/status/detail/instance) and it is not a strict JSON:API error document
  either: each entry carries `title`, `details` and a `source.pointer` JSON Pointer into the offending
  request payload. Responses generated by the edge (for example on the Third-party API host) add a `StatusCode`
  integer and a `RequestUUID` correlation value.'
envelope:
  schema: '#/components/schemas/ErrorResponse'
  fields:
  - name: message
    type: string
    description: A message describing the error.
  - name: errors
    type: array
    description: An array of individual problems encountered during the request.
  - name: errors[].title
    type: string
    description: Short classifier of the problem, e.g. "Unknown", "Invalid type", "enum".
  - name: errors[].details
    type: string
    description: Human-readable explanation of the individual problem.
  - name: errors[].source.pointer
    type: string
    description: JSON Pointer to the invalid data in the submitted payload, e.g. /attributes/MyAttribute.
  - name: StatusCode
    type: integer
    description: HTTP status code repeated in the body (ErrorResponseWithStatus variant).
  - name: RequestUUID
    type: string
    description: Correlation id returned on edge-generated error bodies.
  example:
    message: The submitted data was invalid
    errors:
    - title: Unknown
      details: The attribute "MyAttribute" is not defined on CustomerSession entities.
      source:
        pointer: /attributes/MyAttribute
status_codes:
- status: 400
  title: Bad request
  meaning: Validation error on the request payload or parameters. By far the most common error; read errors[].source.pointer
    and errors[].details to locate the field.
  occurrences: 118
- status: 401
  title: Unauthorized
  meaning: Missing, malformed, expired or wrong-type API key. Integration keys must be prefixed ApiKey-v1,
    Management keys ManagementKey-v1.
  occurrences: 128
- status: 403
  title: Forbidden
  meaning: Key is valid but the endpoint is outside the permissions the admin granted it, or the role
    lacks access to the Application.
  occurrences: 2
- status: 404
  title: Not found
  meaning: The Application, campaign, coupon, profile, session or loyalty entity referenced in the path
    does not exist in this deployment.
  occurrences: 109
- status: 409
  title: Conflict
  meaning: The resource already exists or the requested state transition conflicts with the current state
    (for example duplicate coupon code or campaign state change).
  occurrences: 14
- status: 429
  title: Too many requests
  meaning: Rate limit exceeded. The Management API is limited to three requests per second per endpoint;
    see rate-limits/talon-one-rate-limits.yml.
  occurrences: 34
- status: 500
  title: Internal server error
  meaning: Unexpected server-side failure; retry with backoff and check status.talon.one.
  occurrences: 3
