validation_error_titles:
- title: Unknown
  meaning: The named attribute is not defined on that entity in this deployment. Create the custom attribute
    first via the Management API.
- title: Invalid type
  meaning: The value sent does not match the declared type of the attribute.
- title: enum
  meaning: The value is not one of the allowed enum members, e.g. session state must be open, closed or
    cancelled.
