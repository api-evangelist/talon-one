description: 'First-party Talon.One client libraries. Talon.One ships two generations: next-generation
  SDKs (one repo per language under github.com/talon-one, versioned to the platform release train, e.g.
  26.16) and legacy SDKs it now tells customers to migrate away from. Both are listed so the decay between
  them is visible. Java is distributed from a Talon.One-hosted Maven repository rather than Maven Central,
  PHP through a Composer VCS repository rather than Packagist, and the next-generation C# SDK is built
  from source rather than published to NuGet — three cases where a first-party SDK exists but has no public
  registry entry to date.'
