headers:
  published: false
  observed: []
  note: No rate-limit response headers are declared in any of the five published OpenAPI documents — no
    X-RateLimit-*, no RateLimit-*, no Retry-After — even though 429 is a declared response on 34 operations.
    An agent therefore cannot read remaining quota or a retry delay from the response and must back off
    blindly.
