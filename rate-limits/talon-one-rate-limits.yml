responseCodes:
  throttled: 429
limits:
- name: Management API
  scope: per-endpoint
  window: 1 second
  limit: 3
  unit: requests
  published: true
  source: https://docs.talon.one/docs/dev/management-api/overview
  notes: 'Quoted from the provider docs: "Each of its endpoints has a limit of three requests per second."'
- name: Integration API
  scope: deployment
  window: null
  limit: null
  unit: requests
  published: false
  notes: No numeric limit published. Throughput is bound by the contracted data volume and dedicated deployment
    capacity; this is the surface Talon.One sizes for checkout-path traffic.
- name: Promotion data volume
  scope: account
  window: contract period
  limit: null
  unit: transactions/sessions
  published: false
  notes: Commercial ceiling rather than a request-rate limit; set by the package band. See plans/talon-one-plans-pricing.yml.
- name: Webhooks per account
  scope: account
  window: null
  limit: null
  published: false
  notes: Contractual maximum, shown in the Campaign Manager under Account > Usage & Limits.
policies:
- name: Asynchronous Bulk Operations
  description: Large coupon creation and imports are provided as asynchronous jobs (e.g. coupons_async)
    to keep synchronous request paths responsive.
- name: Pagination
  description: List endpoints offer no_total variants for cursor/offset pagination over large result sets
    to reduce load.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on any 429
    responses.
