description: 'Talon.One publishes exactly one numeric API rate limit: every Management API endpoint is
  limited to three requests per second. That limit is stated in the Management API overview, which also
  says the Management API is for back-office operations and not for real-time integrations. The Integration
  API carries no published numeric cap — it is the high-load, real-time surface, sized by the customer
  contracted data volume and the capacity of that customer dedicated deployment. Bulk work is deliberately
  pushed off the synchronous path onto asynchronous endpoints (coupons_async, coupon deletion jobs, imports)
  and onto the no_total list variants.'
notes: Re-read on 2026-08-13. The previous revision of this file said no numeric limit was published anywhere;
  that was wrong — the Management API overview publishes three requests per second per endpoint. Use the
  asynchronous bulk endpoints for large coupon generation, deletion and imports, and the no_total list
  variants for large result sets. Load testing must be coordinated with Talon.One in advance (https://docs.talon.one/docs/dev/tutorials/load-test).
